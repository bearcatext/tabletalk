name: New recipes

# Writes a few recipes into the catalogue and opens a pull request. It never
# pushes to main: generated cooking is exactly the kind of thing that drifts
# quietly, and a diff takes half a minute to look at.
#
# The key lives in Settings → Secrets and variables → Actions, as
# ANTHROPIC_API_KEY. It is never written into the repository, and the job below
# never echoes it.

on:
  schedule:
    - cron: '0 8 * * 1'      # Mondays, 08:00 UTC
  workflow_dispatch:
    inputs:
      cuisine:
        description: 'Cuisine to write for (blank picks the thinnest)'
        required: false
        type: string
      count:
        description: 'How many to ask for'
        required: false
        default: '3'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write the recipes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set in this repository's Actions secrets."
            exit 1
          fi
          # The run is kept so the pull request can carry the calorie warnings
          # into its body. It contains no key — the generator never echoes one.
          node tools/generate.js \
            ${{ inputs.cuisine && format('--cuisine {0}', inputs.cuisine) || '--thinnest' }} \
            --count ${{ inputs.count || '3' }} | tee /tmp/generate.log

      # Everything the catalogue is held to. A recipe that cannot pass these has
      # no business being proposed, never mind merged.
      - name: Parse
        run: node test/check.js tabletalk.html

      - name: Tests
        run: node test/run.js

      - name: Catalogue
        run: node tools/verify.js tabletalk.html

      - name: Pasta rules
        run: node tools/pasta.js

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing was written — no pull request needed"
            exit 0
          fi
          BRANCH="recipes/$(date +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          # Entries are written in the catalogue's own hand, with unquoted keys.
          # This used to look for '{"id":' — the shape JSON.stringify produces —
          # and counted nothing, the same mistake that had tools/verify.js
          # reporting a next free id that three recipes were already using.
          ADDED=$(git diff --unified=0 tabletalk.html | grep -c '^+  {id:' || true)
          # Anything the calorie checker was unsure about, for the body below.
          WARN=$(sed -n '/calories worth a second look/,$p' /tmp/generate.log | tail -n +2 || true)
          [ -n "$WARN" ] || WARN="  none"
          git config user.name  "Tabletalk"
          git config user.email "noreply@example.com"
          git checkout -b "$BRANCH"
          git add tabletalk.html
          git commit -m "Add ${ADDED} generated recipe(s)

          Written by tools/generate.js and held to the same checks as anything
          else: the app's own validateGenerated, the full test suite, the
          catalogue verifier and the pasta rules. All of them passed before this
          pull request was opened.

          Worth reading rather than merging on sight. The checks judge shape;
          they cannot judge cooking.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push origin "$BRANCH"
          gh pr create \
            --title "New recipes: ${ADDED} for the catalogue" \
            --body "Generated by the weekly job. Every check the catalogue has was run before this opened.

          **Please read the diff rather than merging on sight.** What the checks can and cannot do:

          - **Calories are now checked against the ingredients** (\`tools/calories.js\`), which refuses a figure three times out from what the ingredient list comes to. It is a rough estimate — it knows nothing about bones, shells or trimming — so it warns rather than blocks in the middle ground. Anything it was unsure about:

          \`\`\`
          ${WARN}
          \`\`\`

          - **Whether the recipe is any good** is not checked at all. Heat management, the balance of a sauce and the size of a batch are judgement, and the last run got all three wrong in ways every automated check passed. Read the steps.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
            --base main --head "$BRANCH"

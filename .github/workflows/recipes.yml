name: New recipes

# Writes a few recipes into the catalogue and opens a pull request. It never
# pushes to main: generated cooking is exactly the kind of thing that drifts
# quietly, and a diff takes half a minute to look at.
#
# The key lives in Settings → Secrets and variables → Actions, as
# ANTHROPIC_API_KEY. It is never written into the repository, and the job below
# never echoes it.

on:
  schedule:
    - cron: '0 8 * * 1'      # Mondays, 08:00 UTC
  workflow_dispatch:
    inputs:
      cuisine:
        description: 'Cuisine to write for (blank picks the thinnest)'
        required: false
        type: string
      count:
        description: 'How many to ask for'
        required: false
        default: '3'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write the recipes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set in this repository's Actions secrets."
            exit 1
          fi
          node tools/generate.js \
            ${{ inputs.cuisine && format('--cuisine {0}', inputs.cuisine) || '--thinnest' }} \
            --count ${{ inputs.count || '3' }}

      # Everything the catalogue is held to. A recipe that cannot pass these has
      # no business being proposed, never mind merged.
      - name: Parse
        run: node test/check.js tabletalk.html

      - name: Tests
        run: node test/run.js

      - name: Catalogue
        run: node tools/verify.js tabletalk.html

      - name: Pasta rules
        run: node tools/pasta.js

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "nothing was written — no pull request needed"
            exit 0
          fi
          BRANCH="recipes/$(date +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          ADDED=$(git diff --unified=0 tabletalk.html | grep -c '^+  {"id":' || true)
          git config user.name  "Tabletalk"
          git config user.email "noreply@example.com"
          git checkout -b "$BRANCH"
          git add tabletalk.html
          git commit -m "Add ${ADDED} generated recipe(s)

          Written by tools/generate.js and held to the same checks as anything
          else: the app's own validateGenerated, the full test suite, the
          catalogue verifier and the pasta rules. All of them passed before this
          pull request was opened.

          Worth reading rather than merging on sight. Calorie figures are the
          model's estimate and they decide heart-healthy membership.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push origin "$BRANCH"
          gh pr create \
            --title "New recipes: ${ADDED} for the catalogue" \
            --body "Generated by the weekly job. Every check the catalogue has was run before this opened.

          **Please read the diff rather than merging on sight.** Two things the checks cannot judge:

          - **Calories are estimated** by the model, and the number decides whether a recipe appears under Heart healthy.
          - **Whether the recipe is any good.** Validation catches shape, not cooking.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
            --base main --head "$BRANCH"

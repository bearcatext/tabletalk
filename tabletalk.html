<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabletalk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,300;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Warm earth palette — bark, oat, terracotta, sage, slate-teal.
     No pure white and no true black: --card is warm cream, --chalk is the
     off-white used on dark surfaces, --ink is dark bark rather than #000. */
  --ink:#2f2a22;--ink2:#61574a;--ink3:#7b7263;
  --paper:#f4efe3;--surface:#e9e1d1;--card:#fdfaf2;--chalk:#faf6ec;
  --border:#e0d7c4;--border2:#c9bea8;
  --accent:#b0552a;--accent-s:#f6ebe0;
  --fav:#b98916;--fav-s:#faf2dd;
  --green:#4d7350;--green-s:#e7efe4;
  --blue:#3f6b78;--blue-s:#e6eef0;
  --plum:#6f4a5c;--plum-s:#ece2e6;--plum-b:#cfb3bf;
  --r:10px;--rl:14px;
  --ff:'Fraunces',Georgia,serif;
  --fb:'Instrument Sans',system-ui,sans-serif;
}
body{font-family:var(--fb);background:var(--paper);color:var(--ink);min-height:100vh;font-size:14px}

/* ── NAV ── */
.nav{background:var(--ink);display:flex;align-items:center;padding:0 20px;gap:0;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:200}
.logo{font-family:var(--ff);font-style:italic;color:var(--chalk);font-size:19px;margin-right:auto;padding:13px 0;letter-spacing:.01em;font-weight:300}
.logo b{color:#e8b070;font-style:normal;font-weight:500}
.nt{display:flex;align-items:center;gap:5px;padding:13px 14px;color:#9a8e86;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border:none;background:none;font-family:var(--fb);border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;white-space:nowrap}
.nt:hover{color:#ddd}
.nt.on{color:#e8b070;border-bottom-color:#e8b070}
.nt i{font-size:15px}
.fav-badge{background:var(--fav);color:var(--chalk);border-radius:8px;font-size:10px;padding:1px 5px;margin-left:3px;font-weight:600}

/* ── PAGES ── */
.pg{display:none;max-width:880px;margin:0 auto;padding:22px 18px 110px}
.pg.on{display:block}

/* ── CUISINE BUTTONS ── */
.search-wrap{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border2);border-radius:22px;padding:0 14px;margin-bottom:14px;transition:border-color .15s,box-shadow .15s}
.search-wrap:focus-within{border-color:var(--ink3);box-shadow:0 2px 10px rgba(28,24,20,.06)}
.search-wrap i{color:var(--ink3);font-size:16px;flex-shrink:0}
.search-in{flex:1;min-width:0;border:none;background:none;outline:none;font-family:var(--fb);font-size:13.5px;color:var(--ink);padding:11px 0}
.search-in::placeholder{color:var(--ink3)}
.search-x{display:none;border:none;background:none;color:var(--ink3);font-size:19px;line-height:1;cursor:pointer;padding:4px 2px;flex-shrink:0}
.search-x:hover{color:var(--ink)}
.search-wrap.has-q .search-x{display:block}
.cuisine-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
/* Category picker — full grid on landing, compact bar once you've chosen */
.picker{margin-bottom:20px}
.picker-section{margin-bottom:16px}
.picker-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:9px}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:13px 14px;border:1px solid var(--border2);border-radius:var(--r);background:var(--card);cursor:pointer;text-align:left;font-family:var(--fb);transition:border-color .15s,box-shadow .15s,transform .15s;min-height:78px}
.pcard:hover{border-color:var(--ink3);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard-e{font-size:21px;line-height:1}
.pcard-t{font-size:13.5px;font-weight:600;color:var(--ink);font-family:var(--ff);line-height:1.25}
.pcard-n{font-size:11px;color:var(--ink3);line-height:1.3}
.pcard.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pcard.diet.on{border-color:#9a6428;box-shadow:inset 0 0 0 1px #9a6428}
.pcard.diet .pcard-t{color:#7d5321}
.pcard.effort.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.pcard.effort .pcard-t{color:var(--blue)}
.pcard.pantry{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:0;border-color:var(--green);background:var(--green-s)}
.pcard.pantry .pcard-t{color:var(--green)}
.pcard.pantry.on{box-shadow:inset 0 0 0 1px var(--green)}
.pcard.pantry .pcard-e{font-size:19px}
/* Compact bar */
.picker-done{margin-top:4px}
.picker-done .cta{width:100%;justify-content:center;padding:13px 16px;font-size:14px}
.picker-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:18px}
.picker-bar-cur{display:flex;align-items:center;gap:7px;font-family:var(--ff);font-size:15px;font-weight:600;color:var(--ink)}
.picker-bar-n{font-size:11px;color:var(--ink3);font-family:var(--fb);font-weight:400}
.picker-change{margin-left:auto;display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border2);color:var(--ink2);font-family:var(--fb);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:all .15s}
.picker-change:hover{border-color:var(--ink3);color:var(--ink)}
/* On a phone, 25 stacked category cards is 1,200px of buttons before the first
   recipe. Each group becomes a single strip you swipe sideways instead. */
@media(max-width:700px){
  /* On a phone the pantry leads. Standing in the kitchen, "what can I make with
     what is here" is the first question, not the fifth — and it stays a full
     card rather than becoming one more pill in a strip. */
  .picker{display:flex;flex-direction:column}
  .picker-section.pantry-section{order:-1}
  .pantry-section .picker-grid{display:block;overflow:visible}
  .pcard.pantry{width:100%;border-radius:var(--r);min-height:56px;white-space:normal}
  .pcard.pantry .pcard-n{display:block;color:var(--green);font-weight:600}
  .picker-grid{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;
    overscroll-behavior-x:contain;scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding-bottom:4px;margin-bottom:-4px}
  .picker-section:not(.pantry-section) .picker-grid{
    margin-left:-18px;margin-right:-18px;
    padding-left:18px;padding-right:18px;
    scroll-padding-left:18px}
  .picker-grid::-webkit-scrollbar{display:none}
  .pcard{flex:0 0 auto;flex-direction:row;align-items:center;gap:7px;
    min-height:44px;padding:10px 15px;border-radius:22px;
    scroll-snap-align:start;white-space:nowrap}
  .pcard-n{display:none}
  .pcard-e{font-size:16px}
  .pcard-t{font-size:13px}
  .pcard:hover{transform:none;box-shadow:none}
  .picker-section{margin-bottom:13px}
  .picker-label{margin-bottom:6px}
}
.cta{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:22px;border:1px solid var(--border2);background:var(--card);color:var(--ink2);font-family:var(--fb);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.cta:hover{background:var(--surface);color:var(--ink);border-color:var(--border)}
.cta.on{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.cta .fl{font-size:15px;line-height:1}

/* ── RESULTS BAR ── */
.results-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.results-label{font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.shuffle-btn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:16px;border:1px solid var(--border2);background:var(--card);color:var(--ink2);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.shuffle-btn:hover{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.shuffle-btn i{font-size:14px}

/* ── CARD GRID ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:10px}

/* Each card: white base, unique cuisine accent strip on top */
.recipe-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--rl);
  cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;
  animation:fadeUp .22s ease both;
  position:relative;
  overflow:hidden;
}
.recipe-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(28,24,20,.10);border-color:var(--border2)}
.recipe-card.selected{border-color:var(--ink);border-width:1.5px;box-shadow:0 4px 16px rgba(28,24,20,.08)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Color accent strip — unique per cuisine */
.card-band{
  height:5px;
  width:100%;
  flex-shrink:0;
  transition:height .18s;
}
.recipe-card:hover .card-band{height:7px}

/* Card body padding */
.card-body{padding:13px 14px 13px;display:flex;flex-direction:column;gap:8px;flex:1}

/* Eyebrow + star row */
.card-eyebrow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card-cuisine-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.card-stars-sm{display:flex;align-items:center;gap:3px;font-size:10px}
.stars-visual{display:flex;gap:1px}
.star-pip{font-size:10px;line-height:1}
.star-pip.full{color:#d4a017}
.star-pip.half{color:#d4a017;opacity:.6}
.star-pip.empty{color:#d0c8be}
.card-rating-num{color:var(--ink3);font-size:10px;font-weight:500}

/* Title */
.card-title{font-family:var(--ff);font-size:15px;font-weight:500;line-height:1.25;color:var(--ink);font-style:italic}

/* Meta row */
.card-meta{display:flex;gap:10px;font-size:11px;color:var(--ink3)}
.card-meta span{display:flex;align-items:center;gap:3px}
.card-meta i{font-size:12px}

/* Tags */
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px}
.tag{font-size:10px;padding:2px 7px;border-radius:7px;font-weight:500}
.tq{background:var(--blue-s);color:var(--blue)}
.te{background:var(--fav-s);color:var(--fav)}
.ta{background:var(--accent-s);color:var(--accent)}
/* Generated recipes */
.tg{background:var(--plum-s);color:var(--plum)}
/* Freshness notices */
.fresh-note{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:var(--r);font-size:12px;margin-bottom:12px;background:var(--surface);color:var(--ink2)}
.fresh-note.replenish{background:var(--plum-s);color:var(--plum)}
.fresh-note button{margin-left:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;opacity:.6;padding:0}
.fresh-note button:hover{opacity:1}
.fresh-note .fresh-cta{margin-left:0;font-size:12px;text-decoration:underline;opacity:1;font-family:var(--fb);font-weight:600}
.gen-notice{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:var(--r);font-size:12px;margin-bottom:12px;background:var(--plum-s);color:var(--plum)}
.gen-notice.err{background:#fdecea;color:#991b1b}
.gen-notice button{margin-left:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;opacity:.6;padding:0}
.gen-notice button:hover{opacity:1}
.hidden-note{font-size:11px;color:var(--ink3);margin-bottom:12px}
.hidden-note button{background:none;border:none;color:var(--accent);cursor:pointer;font-family:var(--fb);font-size:11px;text-decoration:underline;padding:0}
.dp-danger{background:none;border:1px solid var(--border2);color:var(--ink3);font-family:var(--fb);font-size:11px;padding:6px 11px;border-radius:8px;cursor:pointer;transition:all .15s}
.dp-danger:hover{border-color:#c0392b;color:#c0392b}

/* Star save button */
.card-fav{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;color:var(--ink3);backdrop-filter:blur(4px)}
.card-fav:hover{color:var(--fav);background:var(--card)}
.card-fav.on{color:var(--fav);background:var(--card)}

/* ── RECIPE DETAIL PANEL ── */
.dp-back{display:none}
.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:16px;overflow:hidden;animation:fadeUp .2s ease both}

.dp-head{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start}
.dp-emoji{font-size:48px;line-height:1;flex-shrink:0}
.dp-info{flex:1;min-width:0}
.dp-title{font-family:var(--ff);font-size:20px;font-weight:500;line-height:1.2;margin-bottom:6px}
.dp-desc{font-size:13px;color:var(--ink2);line-height:1.55;margin-bottom:10px}
.dp-stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{text-align:center}
.stat-n{font-size:19px;font-weight:500;color:var(--accent);font-family:var(--ff)}
.stat-l{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.dp-head-actions{display:flex;gap:8px;align-items:flex-start;flex-shrink:0}
.btn-fav-lg{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:20px;border:1px solid var(--border2);background:var(--card);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;color:var(--ink2);transition:all .15s}
.btn-fav-lg:hover{background:var(--fav-s);border-color:var(--fav);color:var(--fav)}
.btn-fav-lg.on{background:var(--fav-s);border-color:var(--fav);color:var(--fav)}
.btn-cook{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;border:none;background:var(--ink);color:var(--chalk);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s}
.btn-cook:hover{opacity:.8}

.dp-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 20px;gap:0}
.dp-tab{padding:10px 14px;font-size:12px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;letter-spacing:.02em;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--fb)}
.dp-tab:hover{color:var(--ink)}
.dp-tab.on{color:var(--ink);border-bottom-color:var(--ink)}

.dp-body{padding:18px 20px}

/* Ingredients tab */
.serves{display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-family:var(--fb)}
.serves-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.serves-b{width:24px;height:24px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.serves-b:hover:not(:disabled){border-color:var(--ink);background:var(--surface)}
.serves-b:disabled{opacity:.35;cursor:default}
.serves-n{font-family:var(--ff);font-size:16px;font-weight:600;min-width:18px;text-align:center;color:var(--ink)}
.serves-reset{background:none;border:none;color:var(--accent);font-family:var(--fb);font-size:11px;text-decoration:underline;cursor:pointer;padding:0 0 0 4px}
.ing-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.ing-grid{grid-template-columns:1fr}}
.ing-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border-radius:var(--r);border:1px solid transparent;transition:border-color .15s}
.ing-row.core{border-left:3px solid var(--accent)}
.ing-row.swappable{border-left:3px solid var(--border2);cursor:pointer}
.ing-row.swappable:hover{border-color:var(--border2);background:var(--card)}
.ing-emoji{font-size:18px;flex-shrink:0}
.ing-info{flex:1;min-width:0}
.ing-name{font-size:13px;font-weight:500}
.ing-amount{font-size:11px;color:var(--ink3)}
.ing-badge{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:500;flex-shrink:0}
.core-badge{background:var(--accent-s);color:#7a3010}
.swap-badge{background:var(--surface);color:var(--ink3);border:1px solid var(--border2)}
.swap-icon{color:var(--ink3);font-size:14px;flex-shrink:0}

/* swap modal */
.swap-picker{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-top:6px;grid-column:1/-1;animation:fadeUp .15s ease}
.swap-title{font-size:11px;font-weight:500;color:var(--ink2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.swap-opts{display:flex;flex-direction:column;gap:6px}
.swap-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--card);cursor:pointer;color:var(--ink2);font-family:var(--fb);transition:all .15s;text-align:left}
.swap-opt:hover{border-color:var(--border);background:var(--surface)}
.swap-opt.chosen{border-color:var(--green);background:var(--green-s)}
.swap-opt-name{font-size:13px;font-weight:500;flex:1;color:var(--ink)}
.swap-opt-amt{font-size:11px;color:var(--ink3);white-space:nowrap;flex-shrink:0}
.swap-opt-note{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:500;white-space:nowrap;flex-shrink:0}
.note-same{background:#f1ece4;color:#5c5450}
.note-milder{background:#e6f0fb;color:#1e5fa3}
.note-richer{background:#faeeda;color:#7a4f00}
.note-hotter{background:#fde8e8;color:#991b1b}
.note-lighter{background:#e8f4ee;color:#2d6e48}
.note-tangier{background:#f3ebf8;color:var(--plum)}
.note-sweeter{background:#fdf6e3;color:#92400e}
.note-smoky{background:#f3f0eb;color:#4a3728}
.note-neutral{background:#f1ece4;color:#5c5450}

/* Pantry */
.cta.pantry-btn{border-color:var(--green);color:var(--green)}
.cta.pantry-btn.on{background:var(--green);border-color:var(--green);color:var(--chalk)}
.pantry-count{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--green);color:var(--chalk);font-size:10px;font-weight:600}
.cta.pantry-btn.on .pantry-count{background:rgba(255,255,255,.28)}
.pantry-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.pantry-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.pantry-h{font-family:var(--ff);font-size:16px;font-weight:600;color:var(--ink)}
.pantry-sub{font-size:12px;color:var(--ink3);margin-bottom:14px}
.pantry-actions{display:flex;gap:8px;flex-shrink:0}
.pantry-mini{background:none;border:1px solid var(--border2);color:var(--ink2);font-family:var(--fb);font-size:11px;padding:5px 10px;border-radius:8px;cursor:pointer;transition:all .15s}
.pantry-mini:hover{border-color:var(--ink3);color:var(--ink)}
.pantry-group{margin-bottom:12px}
.pantry-group-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:7px}
.pantry-chips{display:flex;flex-wrap:wrap;gap:6px}
.pantry-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--card);color:var(--ink2);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .15s}
.pantry-chip:hover{border-color:var(--ink3)}
.pantry-chip.on{background:var(--green-s,#e8f4ee);border-color:var(--green);color:var(--green);font-weight:500}
.pantry-chip.custom.on{background:#e8f4ee}
.pantry-chip .chip-x{font-size:13px;line-height:1;opacity:.55}
.pantry-add{display:flex;gap:8px;margin-top:6px}
.pantry-add input{flex:1;padding:8px 12px;border:1px solid var(--border2);border-radius:var(--r);font-family:var(--fb);font-size:13px;color:var(--ink);background:var(--paper);outline:none}
.pantry-add input:focus{border-color:var(--green)}
.pantry-add button{padding:8px 14px;border:none;border-radius:var(--r);background:var(--ink);color:var(--chalk);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer}
.pantry-add button:hover{background:var(--accent)}
.pantry-empty{font-size:12px;color:var(--ink3);font-style:italic;padding:2px 0 8px}
/* Match badge on cards */
.match-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:#e8f4ee;color:var(--green);white-space:nowrap}
.match-via{display:block;width:100%;font-size:10.5px;color:var(--green);margin-top:3px;line-height:1.35}
.match-badge.partial{background:#fdf6e3;color:#92400e}
.match-badge.low{background:var(--surface);color:var(--ink3)}
.match-badge i{font-size:11px}

/* Diet categories */
.cta.diet-btn{border-color:#9a6428;color:#7d5321}
.cta.diet-btn.on{background:#9a6428;border-color:#9a6428;color:var(--chalk)}
/* "which swap makes this fit" hint */
/* Allergy mode */
.allergy-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:-6px 0 14px}
.allergy-toggle{position:relative;width:34px;height:19px;border-radius:11px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;padding:0;flex-shrink:0;transition:background .15s,border-color .15s}
.allergy-toggle.on{background:var(--accent);border-color:var(--accent)}
.allergy-knob{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--chalk);transition:left .15s}
.allergy-toggle.on .allergy-knob{left:17px}
.allergy-hint{color:var(--ink3);font-size:11px;flex-basis:100%}
.diet-hint.warn{background:var(--fav-s);color:#7d5321;border:1px solid #e3cf9a;margin-bottom:8px}
.diet-hint{border-radius:var(--r);padding:11px 13px;margin-bottom:12px;font-size:12px;line-height:1.6}
.diet-hint.ok{background:var(--green-s);color:var(--green)}
.diet-hint.no{background:var(--surface);color:var(--ink2)}
.diet-hint.fix{background:var(--fav-s);color:#7d5321;border:1px solid #e3cf9a}
.diet-hint i{margin-right:6px}
.diet-hint-head{font-weight:600;margin-bottom:7px;display:flex;align-items:center}
.diet-hint-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid rgba(125,83,33,.15)}
.diet-hint-row span{flex:1}
.diet-hint-row em{color:var(--ink3);font-style:normal;font-size:11px}
.diet-hint-row button{flex-shrink:0;background:var(--ink);border:none;color:var(--chalk);font-family:var(--fb);font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer}
.diet-hint-row button:hover{background:var(--accent)}
.diet-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:#e8f4ee;color:var(--green);white-space:nowrap}
.diet-badge.swap{background:#fdf6e3;color:#92400e}
.diet-badge i{font-size:11px}
.diet-note{font-size:11px;color:var(--ink3);margin:-8px 0 14px;line-height:1.5}
.diet-note b{color:var(--ink2);font-weight:600}

/* Steps tab */
.step-list{display:flex;flex-direction:column;gap:10px}
.step-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:14px 0 6px}
.step-group:first-child{margin-top:0}
.step-row{display:flex;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--r);align-items:flex-start;cursor:pointer;transition:background .15s}
.step-row:hover{background:#eae4dc}
.step-row.done{opacity:.5}
.step-row.done .step-text{text-decoration:line-through}
.step-n{width:26px;height:26px;background:var(--ink);color:var(--chalk);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;margin-top:1px;transition:background .15s}
.step-row.done .step-n{background:var(--green)}
.step-text{font-size:13px;line-height:1.6;flex:1}
.step-tip{font-size:11px;color:var(--ink3);margin-top:3px;font-style:italic}

/* Comments tab */
.comments-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.comment-item{background:var(--surface);border-radius:var(--r);padding:11px 13px}
.comment-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.comment-date{font-size:11px;color:var(--ink3)}
.comment-text{font-size:13px;color:var(--ink2);line-height:1.55}
.comment-del{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--ink3);font-size:13px;padding:0;line-height:1;transition:color .15s}
.comment-del:hover{color:var(--accent)}
.stars{display:flex;gap:3px;font-size:16px}
.star{cursor:pointer;color:var(--border2);transition:color .15s}
.star.on,.star:hover,.star:hover~.star-reset{color:var(--fav)}
.comment-form{display:flex;flex-direction:column;gap:8px}
.comment-textarea{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;font-family:var(--fb);font-size:13px;color:var(--ink);background:var(--card);resize:vertical;min-height:80px;outline:none;transition:border-color .15s}
.comment-textarea:focus{border-color:var(--border2)}
.comment-submit{align-self:flex-end;display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--ink);border:none;border-radius:var(--r);color:var(--chalk);font-family:var(--fb);font-size:12px;font-weight:500;cursor:pointer;transition:opacity .15s}
.comment-submit:hover{opacity:.75}

/* ── COOK MODE ── */
.cook-overlay{position:fixed;inset:0;background:var(--ink);z-index:500;display:flex;flex-direction:column;color:var(--chalk)}
.cook-nav{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.cook-close{background:none;border:none;color:var(--chalk);cursor:pointer;font-size:20px;display:flex;align-items:center;opacity:.7;padding:0}
.cook-close:hover{opacity:1}
.cook-title{font-family:var(--ff);font-size:16px;font-weight:300;font-style:italic;flex:1;opacity:.8}
.cook-prog{font-size:12px;opacity:.5;margin-left:auto}
.cook-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;gap:20px}
.cook-step-n{font-size:13px;opacity:.4;text-transform:uppercase;letter-spacing:.1em}
.cook-step-text{font-family:var(--ff);font-size:26px;font-weight:300;line-height:1.45;max-width:560px}
.cook-step-tip{font-size:14px;opacity:.5;font-style:italic;max-width:400px}
.cook-footer{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-top:1px solid rgba(255,255,255,.1);gap:12px}
.cook-btn{display:flex;align-items:center;gap:7px;padding:12px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--chalk);font-family:var(--fb);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.cook-btn:hover{background:rgba(255,255,255,.15)}
.cook-btn.primary{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.cook-btn.primary:hover{background:#f0ebe4}
.cook-dots{display:flex;gap:6px;align-items:center}
.cook-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .2s}
.cook-dot.on{background:var(--chalk)}
.cook-complete{font-family:var(--ff);font-size:32px;font-weight:300;font-style:italic;opacity:.9}

/* ── FAVORITES PAGE ── */
.fav-empty{text-align:center;padding:60px 20px;color:var(--ink3)}
.fav-empty i{font-size:40px;display:block;margin-bottom:12px;opacity:.4}
.fav-empty p{font-size:14px}
.fav-empty small{font-size:12px;margin-top:4px;display:block;opacity:.7}

/* ── MARCO BAR ── */
/* Meal plan */
.card-plan{position:absolute;top:10px;right:42px;width:26px;height:26px;border-radius:50%;background:rgba(253,250,242,.85);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;color:var(--ink3);backdrop-filter:blur(4px)}
.card-plan:hover{color:var(--accent);background:var(--card)}
.card-plan.on{color:var(--accent);background:var(--accent-s)}
.btn-plan{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--ink2);font-family:var(--fb);font-size:12px;cursor:pointer;transition:all .15s}
.btn-plan:hover{border-color:var(--accent);color:var(--accent)}
.btn-plan.on{background:var(--accent-s);border-color:var(--accent);color:var(--accent)}
/* Recipe builder */
.to{background:var(--blue-s);color:var(--blue)}
.pcard.own .pcard-t{color:var(--accent)}
.pcard.own.add{border-style:dashed}
.bld-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:16px}
.bld-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:20px 0 9px}
.bld-row{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:9px}
.bld-grid{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bld-grid+.bld-grid,.bld-grid+.bld-in{margin-top:8px}
.bld-in{flex:1 1 130px;min-width:0;padding:9px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--paper);font-family:var(--fb);font-size:13px;color:var(--ink);outline:none}
.bld-in:focus{border-color:var(--accent)}
.bld-in.emoji{flex:0 0 52px;text-align:center;font-size:17px}
.bld-in.amt{flex:0 0 110px}
.bld-in.wide{width:100%;flex-basis:100%;margin-top:8px}
.bld-in.area{width:100%;min-height:58px;resize:vertical;margin-top:8px;line-height:1.5}
.bld-grid.head .bld-in:not(.emoji){font-family:var(--ff);font-size:16px;font-weight:600}
.bld-n{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--ink);color:var(--chalk);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.bld-x{flex:0 0 30px;height:30px;border:none;background:none;color:var(--ink3);font-size:18px;cursor:pointer;border-radius:7px}
.bld-x:hover{background:var(--surface);color:var(--accent)}
.bld-swaps{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border2)}
.bld-check{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);cursor:pointer;margin-bottom:8px}
.bld-grid.swap{margin-bottom:6px}
.bld-add{background:none;border:1px dashed var(--border2);color:var(--ink2);font-family:var(--fb);font-size:12.5px;padding:9px 15px;border-radius:8px;cursor:pointer;transition:all .15s}
.bld-add:hover{border-color:var(--accent);color:var(--accent)}
.bld-add.sm{font-size:11.5px;padding:6px 11px}
.bld-sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.bld-sugg>span{font-size:11px;color:var(--ink3)}
.sugg-chip{background:var(--accent-s);border:1px solid var(--border2);color:var(--accent);font-family:var(--fb);font-size:11.5px;padding:5px 10px;border-radius:20px;cursor:pointer;transition:all .15s}
.sugg-chip:hover{border-color:var(--accent)}
.sugg-chip em{font-style:normal;color:var(--ink3)}
.bld-error{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:var(--r);background:#fdf4f3;border:1px solid #e7b7b1;color:#8a2a20;font-size:12.5px;margin-bottom:14px}
.bld-actions{display:flex;gap:8px;margin-top:20px}
.plan-empty{text-align:center;padding:44px 20px;color:var(--ink3)}
.plan-empty p{margin:0 0 8px}
.plan-empty-sub{font-size:12px;max-width:380px;margin:0 auto}
.plan-sec-head{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin:22px 0 10px}
.plan-sec-head button{margin-left:auto;background:none;border:none;color:var(--ink3);font-family:var(--fb);font-size:10px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;text-decoration:underline}
.plan-sec-head button:hover{color:var(--accent)}
.plan-sub{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:11px}
.plan-chips{display:flex;flex-wrap:wrap;gap:7px}
.plan-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 11px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12.5px;color:var(--ink)}
.plan-chip button{background:none;border:none;color:var(--ink3);cursor:pointer;font-size:15px;line-height:1;padding:0}
.plan-chip button:hover{color:var(--accent)}
.shop-list{list-style:none;padding:0;margin:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.shop-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.shop-list li:last-child{border-bottom:none}
.shop-name{font-weight:500;color:var(--ink);flex:1 1 auto;min-width:0;font-size:13px}
.shop-amt{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.shop-from{font-size:10.5px;color:var(--ink3);flex:0 0 100%;margin-top:1px}
.plan-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.plan-btn{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--card);color:var(--ink2);font-family:var(--fb);font-size:13px;cursor:pointer;transition:all .15s}
.plan-btn:hover{border-color:var(--ink3);color:var(--ink)}
.plan-btn.primary{background:var(--ink);border-color:var(--ink);color:var(--chalk);font-weight:600}
.plan-btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.plan-hint{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.6}
.qr-panel{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;margin-top:14px;padding:16px;border:1px solid var(--border2);border-radius:var(--rl);background:var(--card)}
.qr-code{width:min(420px,86vw);flex:0 0 auto;line-height:0;border-radius:8px;overflow:hidden}
.qr-help{flex:1 1 230px;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--ink2);line-height:1.6}
.qr-help b{font-family:var(--ff);font-size:14px;font-weight:500;color:var(--ink)}
.qr-meta{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.qr-too-long{font-size:12px;color:var(--accent);line-height:1.6}
.plan-notice{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:var(--r);background:var(--green-s);color:var(--green);font-size:12px;margin-bottom:14px}
.plan-notice button{margin-left:auto;background:none;border:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0}
@media print{
  nav,.marco-wrap,.plan-actions,.plan-chips,.plan-sec-head button,.cook-overlay,#pg-discover,#pg-favorites,.plan-notice,.qr-panel{display:none!important}
  body{background:#fff}
  .shop-list{border:none}
  .shop-list li{border-color:#ddd;page-break-inside:avoid}
  .shop-name::before{content:"☐  "}
}
.marco-wrap{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--border);padding:10px 18px 14px;z-index:100}
.marco-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border2);border-radius:var(--rl);padding:8px 12px}
.marco-av{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.marco-in{flex:1;border:none;background:transparent;font-family:var(--fb);font-size:13px;color:var(--ink);outline:none}
.marco-in::placeholder{color:var(--ink3)}
.marco-send{width:40px;height:40px;border-radius:50%;background:var(--ink);border:none;color:var(--chalk);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.marco-send:hover{opacity:.75}
.marco-send i{font-size:14px}

.marco-reply{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px;font-size:13px;color:var(--ink2);line-height:1.65;animation:fadeUp .2s ease both}
/* Marco transcript */
#marco-reply-area-bar{max-height:46vh;overflow-y:auto}
.marco-thread-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:8px}
.marco-thread-head button{background:none;border:none;color:var(--ink3);font-family:var(--fb);font-size:10px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;text-decoration:underline}
.marco-thread-head button:hover{color:var(--accent)}
.marco-msg{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:13px 15px;margin-bottom:8px;font-size:13px;color:var(--ink2);line-height:1.65;animation:fadeUp .2s ease both}
.marco-msg.user{background:var(--ink);border-color:var(--ink);color:var(--chalk);margin-left:auto;max-width:78%;width:fit-content;border-bottom-right-radius:5px}
.marco-msg.err{border-color:#e7b7b1;background:#fdf4f3;color:#8a2a20}
.marco-code{font-size:11px;background:var(--surface);color:var(--ink2);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:6px}
.marco-offer{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 13px;border-radius:8px;border:1px solid var(--plum-b);background:var(--plum-s);color:var(--plum);font-family:var(--fb);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.marco-offer:hover:not(:disabled){background:#e2d2d9}
.marco-offer:disabled{opacity:.55;cursor:default}
.marco-offer.done{background:var(--green-s);border-color:#9ecfb4;color:var(--green);cursor:default}
/* Marco inside cook mode */
.cook-marco-btn{background:none;border:1px solid rgba(255,255,255,.25);color:var(--chalk);font-family:var(--fb);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
.cook-marco-btn:hover{background:rgba(255,255,255,.12)}
.cook-marco{display:none;flex-direction:column;gap:10px;position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--border);padding:14px 18px;max-height:60vh;z-index:20}
#cook-marco-area{overflow-y:auto;flex:1}
.cook-marco .marco-inner{max-width:100%}
.marco-rhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.marco-rname{font-size:13px;font-weight:500;color:var(--ink)}
.typing{display:flex;gap:4px;align-items:center;padding:2px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:blink 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.marco-local{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-top:6px}
.marco-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.mmc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.mmc:hover{background:var(--card);border-color:var(--border2)}
.mmc-e{font-size:20px;flex-shrink:0}
.mmc-t{font-size:13px;font-weight:500;color:var(--ink);flex:1}
.mmc-m{font-size:11px;color:var(--ink3);white-space:nowrap}

.divider{border:none;border-top:1px solid var(--border);margin:20px 0 16px}
.pg-head{margin-bottom:18px}
.pg-title{font-family:var(--ff);font-size:24px;font-weight:300;font-style:italic;color:var(--ink)}
.pg-title b{font-weight:500;font-style:normal;color:var(--accent)}
.pg-sub{font-size:12px;color:var(--ink3);margin-top:4px}

/* ── WHO IS COOKING ── */
.who-btn{margin-left:12px;width:38px;height:38px;border-radius:50%;padding:0;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.09);
  color:var(--chalk);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;transition:background .15s}
.who-btn:hover{background:rgba(255,255,255,.18)}

/* ── PHONE: RECIPE DETAIL ──
   These override the .dp-* rules above, so they have to come after them. When
   they lived up beside the picker block the base rules won every shared
   property and the back button never rendered. */
@media(max-width:700px){
  /* Expanding inline shoves the rest of the list a long way down and you lose
     your place. On a phone the recipe takes the whole screen instead. */
  .detail-panel{position:fixed;inset:0;z-index:300;margin:0;border:0;border-radius:0;
    overflow-y:auto;overscroll-behavior:contain;background:var(--paper);
    animation:none;padding-bottom:24px}
  .dp-head{flex-direction:column;align-items:stretch;gap:10px;
    padding:10px 16px 14px}
  .dp-title{font-size:22px;line-height:1.15}
  .dp-desc{margin-bottom:0}
  .dp-stats{gap:0;justify-content:space-between}
  .stat{text-align:left;flex:1 1 0;min-width:0}
  .stat-n{font-size:17px}
  .stat-l{font-size:9px}
  /* let them wrap instead of overflowing the screen */
  .dp-head-actions{flex-wrap:wrap;align-items:center}
  .dp-head-actions>*{flex:0 0 auto}
  .dp-back{display:flex;align-items:center;justify-content:center;
    position:fixed;top:10px;left:10px;z-index:310;
    width:44px;height:44px;border-radius:50%;border:1px solid var(--border2);
    background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;
    box-shadow:0 2px 10px rgba(28,24,20,.18)}
  .detail-panel{padding-top:60px}
  .dp-emoji{display:none}
  /* thumbs need a bigger target than a mouse does */
  .serves-b{width:38px;height:38px;font-size:19px}
  .card-fav,.card-plan{width:38px;height:38px}
  .dp-tab{padding:12px 14px}
  /* Category pills. These sit at the end so they beat both the base .pcard
     rules and the picker block above. A thumb needs a target it can read at
     arm's length, so the content grows to fill the pill rather than floating
     in the middle of it. */
  .pcard{min-height:66px;padding:0 22px;gap:10px;border-radius:33px;
    border-width:1.5px}
  .pcard-e{font-size:22px}
  .pcard-t{font-size:15px}
  /* A 1px ring is hard to pick out on a phone held at arm's length. Selected
     pills fill instead, the same way .cta.on already does. */
  .pcard.on:not(.pantry){background:var(--ink);border-color:var(--ink);box-shadow:none}
  .pcard.on:not(.pantry) .pcard-t{color:var(--chalk)}
  .pcard.diet.on{background:#9a6428;border-color:#9a6428}
  .pcard.effort.on{background:var(--blue);border-color:var(--blue)}
  /* the pantry stays a full-width card, not a pill */
  .pcard.pantry{padding:14px 18px}
  .pantry-chip{min-height:40px;padding:0 15px;font-size:14px;border-radius:20px}
  .pantry-chips{gap:8px}
  .pantry-chip .chip-x{font-size:15px}
  .pantry-mini,.picker-change{min-height:40px;padding:0 15px;font-size:13px}
  .allergy-toggle::after{content:"";position:absolute;top:-13px;bottom:-13px;
    left:-9px;right:-9px}
  .fresh-note button,.gen-notice button,.plan-notice button,.hidden-note button{
    position:relative;min-width:24px;min-height:24px}
  .fresh-note button::after,.gen-notice button::after,.plan-notice button::after,
  .hidden-note button::after{content:"";position:absolute;top:-10px;bottom:-10px;
    left:-12px;right:-12px}
  .nav{padding:0 12px}
  .logo{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who-btn{margin-left:8px;width:34px;height:34px;font-size:16px}
  .who-sheet{max-width:none;padding:16px;border-radius:var(--r)}
  .picker-done{position:sticky;bottom:8px;z-index:5}
  .picker-done .cta{min-height:48px;box-shadow:0 4px 14px rgba(28,24,20,.22)}
  .shuffle-btn{min-height:40px;padding:0 15px;font-size:13px}
  .pantry-add input,.pantry-add button{min-height:44px}
  .pantry-add button{padding:0 18px;font-size:14px}
  /* iOS Safari zooms the page whenever a focused input is under 16px, and it
     does not zoom back out. All three inputs were 13px. The viewport tag is
     deliberately left without maximum-scale so pinch-zoom still works, which
     means the type size is the fix. */
  .search-in,#pantry-input,.marco-in{font-size:16px}
  /* the input was 16px tall inside a 58px bar, so most of the bar was not
     tappable */
  .marco-in{align-self:stretch}
  /* The way out of a full-screen mode should not be the smallest thing on it.
     This was 20px square, with wet or floury hands in the mix. */
  .cook-close{width:44px;height:44px;margin-right:-10px}
  .cook-marco-btn{min-height:40px;padding:0 14px;font-size:13px}
  /* the recipe header actions were 28-31px */
  .dp-head-actions>button{min-height:40px;padding:0 15px;font-size:13px}
  .dp-head-actions>.dp-danger{font-size:12px}
  /* The x that drops a meal from the plan was 9px wide by 15 tall. Next to it
     sat Clear all, which empties the whole plan, at 12px — so the small target
     was the recoverable action and the big one was not. */
  .plan-chip{min-height:40px;padding:0 6px 0 14px;font-size:14px}
  .plan-chip button{width:32px;height:32px;display:flex;align-items:center;
    justify-content:center;font-size:18px;border-radius:50%}
  .plan-sec-head button,.marco-thread-head button{min-height:40px;display:flex;
    align-items:center;padding:0 4px}
  /* an underlined word inside a sentence, so it keeps its place in the line
     and grows the hit box around it */
  .fresh-note .fresh-cta{display:inline-flex;align-items:center;min-height:38px}
}
</style>
</head>

// Everything the app remembers is personal: your pantry, what you starred, this

// writing over each other, so every key is filed under whoever is signed in.
//
// A profile can carry a PIN. Be clear about what that is: it stops someone
// tapping into the wrong pantry by accident. It is not protection — the data
// sits in this browser's storage and anyone who opens the developer tools can
// read it, and a four-digit PIN is ten thousand guesses whatever we hash it
// with. It is a door you have to mean to open, not a lock.
const DW_KEYS=['dw_favs','dw_comments','dw_swaps','dw_steps','dw_pantry',

// Salted, so a PIN someone reuses elsewhere is not sitting there in the clear.
// Not a security measure; see above.
function pinHash(pin,salt){
  let h=5381;
  const t=String(salt)+':'+String(pin);
  for(let i=0;i<t.length;i++) h=((h*33)^t.charCodeAt(i))>>>0;
  return h.toString(16);
}
function newSalt(){return Math.random().toString(36).slice(2,10)}
function profileById(id){return profiles.find(p=>p.id===id)||null}
function currentProfile(){return profileById(activeProfile)}
function pinOk(p,pin){return !p.pin||p.pin.h===pinHash(pin,p.pin.s)}
function setPin(id,pin){
  const p=profileById(id); if(!p) return;
  if(pin==null||pin===''){p.pin=null}
  else{const s=newSalt();p.pin={s:s,h:pinHash(pin,s)}}
  saveProfiles();
}

function pool(c){
  const vis=r=>!hidden.has(r.id);
  if(c==='search') return searchResults().filter(vis);
  if(c==='mine') return ownRecipes().filter(vis);
  if(c==='pantry') return pantryRanked().filter(vis);
  if(isEffortCat(c)) return effortPool(c).filter(vis);

// by brand. Avoiding dairy is a preference and these are usually fine; an
// allergy is a safety matter and they are not. Which behaviour applies is
// the user's call via allergyMode.
const MAY_CONTAIN={
  // Enriched breads and crumbed/processed items only. Lean breads (sourdough,
  // ciabatta, baguette) and corn tortillas are reliably dairy-free.
  df: rx(['breadcrumb','panko','flour tortilla','bun','roll','pain de mie','white bread','white sandwich bread','pizza dough','bread dough','naan','pastry','phyllo','filo','biscuit dough','curry roux','tonkatsu sauce','okonomiyaki sauce','chocolate','pesto']),

  gf: rx(['oat','stock','broth','curry powder','curry paste','spice blend','baking powder','tandoori masala','garam masala','five spice']),
  nf: rx(['curry paste','chocolate','pesto','satay','muesli','granola','spice blend']),
  // Pasta may carry egg; wine and some breads use animal-derived processing.
  vgn: rx(['bread','pasta','pastry','chocolate','curry paste','kimchi','wine','pizza dough']),
  // Hard cheese often uses animal rennet; kimchi often contains shrimp.
  veg: rx(['kimchi','wine','cheese','curry paste']),
};
function mayContain(cat,name){
  const re=MAY_CONTAIN[cat];
  if(!re) return false;
  const n=String(name||"").toLowerCase();
  if(!n||OMISSION.test(n)) return false;
  return re.test(n) && !violatesBase(cat,n);   // already-hard hits are not "maybe"
}

function riskyIngredients(r,cat){
  const out=[];

    if(mayContain(cat,n)) out.push(n);
  });
  return [...new Set(out)];
}

// --- heart-healthy inputs ----------------------------------------------------
// Coconut milk is dairy-free but still high in saturated fat, so it lives here
// and not in DAIRY.
const SAT_FAT = rx([
  'butter', 'ghee', 'lard', 'cream', 'creme fraiche', 'crème fraîche', 'cheese',
  'cheddar', 'parmesan', 'pecorino', 'mozzarella', 'gruyère', 'gruyere', 'halloumi',
  'paneer', 'mascarpone', 'bacon', 'lardon', 'pancetta', 'guanciale', 'chorizo',
  'sausage', 'salami', 'pork belly', 'salt pork', 'duck confit', 'coconut milk',
  'coconut cream', 'evaporated milk', 'condensed milk', 'puff pastry', 'shortcrust',
]);
const SAT_FAT_OK = rx(['butter bean', 'butter lettuce', 'butternut', 'peanut butter', 'nut butter', 'vegan butter', 'cashew cream']);

// Heart healthy was exclusion-only, so a plain tomato pasta qualified on the
// strength of having no butter. It now needs a lean protein, and fish and
// poultry rank ahead of the rest.
const FISH_LEAN = rx(['fish','salmon','trout','cod','sea bass','sea bream','plaice','sole','sardine','mackerel','tuna','prawn','shrimp','crab','lobster','clam','mussel','squid','octopus','scallop','seafood','anchovy','anchovies']);
const POULTRY_LEAN = rx(['chicken','turkey','poultry']);
const PLANT_PROTEIN = rx(['bean','lentil','chickpea','dal','dhal','tofu','tempeh','edamame','pea','split pea','quinoa']);
const EGG_PROTEIN = rx(['egg']);
// A tablespoon of fish sauce does not make it a fish dish. Seasonings are
// excluded before working out what the protein actually is.
const PROTEIN_SEASONING = rx(['fish sauce','anchovy paste','anchovy broth','oyster sauce','shrimp paste','bonito','katsuobushi','dashi','worcestershire','miso','doenjang','gochujang','chicken stock','chicken broth','beef stock','beef broth','pork bone broth','stock','broth']);
function leanProtein(r){
  const names=r.ing.map(i=>i.n).filter(n=>!PROTEIN_SEASONING.test(n)).join(' | ');
  if(FISH_LEAN.test(names)) return 'fish';
  if(POULTRY_LEAN.test(names)) return 'poultry';
  if(PLANT_PROTEIN.test(names)) return 'plant';
  if(EGG_PROTEIN.test(names)) return 'egg';
  return null;
}
const HH_PROTEIN_RANK={fish:0,poultry:1,plant:2,egg:3};

const RED_MEAT = rx([
  'beef', 'steak', 'sirloin', 'ribeye', 'bavette', 'flank', 'chuck', 'brisket',
  'short rib', 'veal', 'lamb', 'mutton', 'pork', 'bacon', 'lardon', 'pancetta',
  'guanciale', 'prosciutto', 'chorizo', 'sausage', 'salami', 'ham', 'salt pork',
  'duck', 'confit',
]);
const DEEP_FRY = /deep[-\s]?fr(y|ied|ying)|fry at 1[6-9]0|\b1[6-9]0°C\b/i;
const HH_CALORIE_CAP = 500;

// Swap options that remove the ingredient entirely rather than replacing it.
const OMISSION = /^(omit|skip|none|no\b|without)/i;

const norm = (s) => String(s || '').toLowerCase().trim();

function violatesBase(cat, name) {
  const n = norm(name);
  if (!n || OMISSION.test(n)) return false;
  const dairy = () => !PLANT_DAIRY.test(n) && DAIRY.test(n);
  switch (cat) {
    case 'df':  return dairy();
    case 'gf':  return GLUTEN.test(n) && !GLUTEN_OK.test(n);
    case 'veg': return !ANIMAL_OK.test(n) && (MEAT.test(n) || FISH.test(n));
    case 'vgn': return (!ANIMAL_OK.test(n) && (MEAT.test(n) || FISH.test(n))) || EGG.test(n) || HONEY.test(n) || dairy();
    case 'nf':  return NUTS.test(n) && !NUTS_OK.test(n);
    case 'hh':  return (SAT_FAT.test(n) && !SAT_FAT_OK.test(n)) || RED_MEAT.test(n);
    default:    return false;
  }
}

// With allergyMode on, anything uncertain counts as a violation.
function violates(cat, name) {
  if (violatesBase(cat, name)) return true;
  return allergyMode ? mayContain(cat, name) : false;
}

const effName = (r, i, applied) => {
  const chosen = applied && applied[r.id + '-' + i];
  return (chosen && chosen.n) || r.ing[i].n;
};

/**
 * status(recipe, cat, appliedSwaps)
 *   ok          qualifies as currently configured
 *   fixable     every blocker has a swap option that clears it
 *   swapsNeeded how many swaps away from qualifying
 */
function status(r, cat, applied) {
  const blockers = [];
  let fixable = true, swapsNeeded = 0;

  r.ing.forEach((ing, i) => {
    if (!violates(cat, effName(r, i, applied))) return;
    blockers.push(ing.n);
    if ((ing.swaps || []).some((s) => !violates(cat, s.n))) swapsNeeded++;
    else fixable = false;
  });

  // Heart-healthy also weighs method and calories, which no swap can fix.
  if (cat === 'hh') {
    if (r.cals > HH_CALORIE_CAP) { blockers.push(r.cals + ' cal'); fixable = false; }
    const steps = r.steps.map((s) => s.s + ' ' + (s.tip || '')).join(' ');
    if (DEEP_FRY.test(steps)) { blockers.push('deep-fried'); fixable = false; }
    // Lean protein is an emphasis, not a requirement. A vegetable dish can be
    // heart healthy, and shutting them all out left the category monotonous.
    // dietPool still sorts fish, then poultry, then plant, then egg, then the
    // rest, so protein-carrying dishes lead without excluding anything.
  }

  return { ok: !blockers.length, fixable: blockers.length > 0 && fixable, blockers, swapsNeeded };
}



// Browsable diet categories. These sit alongside the cuisines in the picker.
const DIET_CATS=[
  {id:'hh', label:'Heart healthy', fl:'💚', short:'heart healthy'},
  {id:'df', label:'Dairy-free',    fl:'🥛', short:'dairy-free'},
  {id:'gf', label:'Gluten-free',   fl:'🌾', short:'gluten-free'},
  {id:'veg',label:'Vegetarian',    fl:'🥬', short:'vegetarian'},
  {id:'vgn',label:'Vegan',         fl:'🌱', short:'vegan'},
  {id:'nf', label:'Nut-free',      fl:'🥜', short:'nut-free'},
];
// A generated recipe can introduce a cuisine the app did not ship with (a
// Marco-written pho, say). Surface it in the picker so it is reachable.
function allCuisines(){
  const known=new Set(CUISINES.map(c=>c.id));
  const extra=[...new Set(ALL_RECIPES.map(r=>r.c))].filter(c=>!known.has(c))
    .map(c=>({id:c,label:c,fl:"🍽"}));
  return CUISINES.concat(extra);
}
const DIET_IDS=DIET_CATS.map(c=>c.id);
const isDietCat=id=>DIET_IDS.includes(id);
const dietCat=id=>DIET_CATS.find(c=>c.id===id);

// status() walks every ingredient, so memoise. Applied swaps change the answer,
// which is why applySwap() clears this.
let _dietCache={};
function clearDietCache(){_dietCache={}}
function dietStatus(r,cat){
  const k=cat+'|'+r.id;
  if(!(k in _dietCache)) _dietCache[k]=status(r,cat,swaps);
  return _dietCache[k];
}

// Recipes for a diet category: fully qualifying first, then the ones a swap
// away, so "dairy-free with 1 swap" is offered rather than hidden.
function dietPool(cat){
  const ok=[],fix=[];
  ALL_RECIPES.forEach(r=>{
    const s=dietStatus(r,cat);
    if(s.ok)ok.push(r); else if(s.fixable)fix.push(r);
  });
  // Heart healthy leads with fish, then poultry, then plant protein.
  if(cat==='hh') ok.sort((a,b)=>
    (HH_PROTEIN_RANK[leanProtein(a)]??9)-(HH_PROTEIN_RANK[leanProtein(b)]??9)||a.cals-b.cals);
  fix.sort((a,b)=>dietStatus(a,cat).swapsNeeded-dietStatus(b,cat).swapsNeeded);
  return ok.concat(fix);
}

// Says plainly how a category is decided, so the label isn't a black box.
// Preference vs allergy is the user's call, not something the app can infer.
function toggleAllergyMode(){
  allergyMode=!allergyMode;
  clearDietCache();save();
  if(sel.diets.length) setShown(pickPage(selPool(),[]));
  renderCuisineRow();renderCards();
}

// ─── PANTRY ───────────────────────────────────────────────────────────────────
const PANTRY_STAPLES={
  'Basics':['Olive oil','Butter','Garlic','Onion','Salt','Black pepper','Flour','Sugar','Rice','Pasta','Eggs','Stock','Bread'],
  'Produce':['Tomatoes','Lemon','Lime','Ginger','Spring onions','Carrot','Potato','Bell pepper','Spinach','Cilantro','Chili','Mushrooms','Cucumber','Avocado'],
  'Protein':['Chicken breast','Chicken thighs','Ground beef','Ground pork','Shrimp','Salmon','Tofu','Chickpeas','Black beans','Bacon'],
  'Dairy':['Milk','Heavy cream','Parmesan','Yogurt','Cheddar','Feta','Mozzarella'],
  'Sauces & spices':['Soy sauce','Fish sauce','Coconut milk','Tomato paste','Canned tomatoes','Vinegar','Honey','Sesame oil','Cumin','Paprika','Chili flakes','Curry paste','Oregano','Tahini'],
};

// Words that describe an ingredient rather than identify it — dropped before matching
// so "2 finely chopped fresh garlic cloves" and "garlic" resolve to the same thing.
const ING_STOPWORDS=/\b(fresh|freshly|dried|ground|chopped|minced|sliced|diced|crushed|grated|large|small|medium|extra|virgin|kosher|flaky|toasted|raw|ripe|boneless|skinless|low|sodium|unsalted|salted|plain|whole|thinly|finely|roughly|good|quality|cooked|uncooked|leftover|day|old|for|serving|garnish|optional|to|taste|or|and|of|a|the|drained|rinsed)\b/g;
const stemWord=w=>w.replace(/ies$/,'y').replace(/(ch|sh|ss|x|o)es$/,'$1').replace(/([^s])s$/,'$1');
function normIng(s){
  return (s||'').toLowerCase()
    .replace(/\([^)]*\)/g,' ')
    .replace(/[^a-z\s]/g,' ')
    .replace(ING_STOPWORDS,' ')
    .replace(/\s+/g,' ').trim()
    .split(' ').filter(Boolean).map(stemWord).join(' ');
}
// Fuzzy match: true when every word of the shorter name appears in the longer one.
// Word-level (not substring) so "egg" does not match "eggplant".
// "Chicken" should satisfy "Chicken thighs" — the extra word describes the same
// thing. "Rice" must not satisfy "Rice vinegar", and "Butter" must not satisfy
// "Peanut butter": there the extra word makes it a different product entirely.
// The difference is not grammatical, so the words that merely describe are
// listed and everything else is treated as a change of ingredient.
const ING_MODIFIER=new Set([
  'large','small','medium','baby','jumbo','ripe','fresh','dried','frozen','canned',
  'tinned','cooked','raw','leftover','toasted','smoked','plain','natural','free',
  'range','organic','unsalted','salted',
  'red','green','white','yellow','black','purple','jasmine','basmati','arborio',
  'carnaroli','roma','cherry','salad','greek','flat','leaf','long','short','grain',
  'thigh','breast','fillet','leg','wing','shoulder','loin','chop','shank','mince',
  'ground','boneless','skinless','bone','whole','half','piece','zest','juice',
  'chopped','sliced','diced','minced','grated','crushed','shredded','peeled',
  'thin','thick','finely','roughly','thinly','trimmed','halved','quartered',
  // units and forms: a clove of garlic is still garlic
  'clove','sprig','stalk','head','bulb','stick','bunch','handful','sheet',
]);
function pantryHas(ingName){
  const a=normIng(ingName);
  if(!a) return false;
  const wa=a.split(" ");
  for(const p of pantry){
    const b=normIng(p);
    if(!b) continue;
    if(a===b) return true;
    const wb=b.split(" ");
    const [shortW,longW]=wa.length<=wb.length?[wa,wb]:[wb,wa];
    if(!shortW.length||!shortW.every(w=>longW.includes(w))) continue;
    const extra=longW.filter(w=>!shortW.includes(w));
    if(extra.every(w=>ING_MODIFIER.has(w))) return true;
  }
  return false;
}
// Scores a recipe against the pantry, honouring any swap the user has applied.
// The catalogue carries 1,115 substitutions, each written with an amount and a
// note. Ignoring them when deciding what you can cook wastes the best thing in
// the data: a recipe wanting guanciale is within reach if you have bacon, and
// the app already knows that.
function pantryMatch(r){
  let have=0; const missing=[], via=[];
  r.ing.forEach((ing,i)=>{
    const n=getIngName(r.id,i);
    if(pantryHas(n)){have++;return}
    const alt=(ing.swaps||[]).find(s=>pantryHas(s.n));
    if(alt){have++;via.push({from:ing.n,to:alt.n});return}
    missing.push(n);
  });
  const total=r.ing.length;
  return {have:have,total:total,pct:total?have/total:0,
          missing:total-have,missingNames:missing,via:via};
}
// Full catalogue ordered by how close the user is to being able to cook it.
// A sort alone could not answer "what can I cook tonight" — everything stayed
// on the list, just in a better order. Requiring every ingredient would be too
// strict to be useful, so this shows what a small top-up would get you.
const PANTRY_MAX_MISSING=2;
function pantryRanked(){
  const scored=ALL_RECIPES
    .map(r=>({r:r,m:pantryMatch(r)}))
    .sort((a,b)=> b.m.pct-a.m.pct || b.m.have-a.m.have || a.m.missing-b.m.missing || a.r.mins-b.r.mins);
  if(!pantry.size) return scored.map(x=>x.r);   // nothing to match against yet
  return scored.filter(x=>x.m.missing<=PANTRY_MAX_MISSING).map(x=>x.r);
}
function matchBadgeHtml(r){
  if(!pantry.size) return "";
  const m=pantryMatch(r);
  const cls=m.pct===1?"":(m.pct>=.6?" partial":" low");
  const icon=m.pct===1?"ti-circle-check":"ti-basket";
  const label=m.pct===1?`all ${m.total} ingredients`
    :(m.missing<=2?`need ${m.missingNames.join(", ")}`:`${m.have}/${m.total} ingredients`);
  // say which substitution is carrying it, so nobody opens the recipe and
  // finds an ingredient they were told they had
  const via=m.via.length
    ? `<span class="match-via">via ${m.via.map(v=>`${v.to} for ${v.from.toLowerCase()}`).join(", ")}</span>`
    : "";
  return `<span class="match-badge${cls}"><i class="ti ${icon}"></i>${label}</span>${via}`;
}

// ─── FRESHNESS ───────────────────────────────────────────────────────────────
// Rotation used to exclude only the five on screen, so it repeated at cycle ~3
// and took ~10 cycles to show a 20-recipe cuisine (the floor is 4). Tracking
// what you've actually seen lets us show unseen recipes first, and tells us
// when a category has genuinely run dry so we can offer to top it up.
const PAGE=5;

function markSeen(ids){
  const now=Date.now();
  ids.forEach(id=>{
    const s=seen[id]||(seen[id]={n:0,last:0});
    s.n++;s.last=now;
  });
  save();
}
function markCooked(id){
  const c=cooked[id]||(cooked[id]={n:0,last:0});
  c.n++;c.last=Date.now();
  save();
}
// Single choke point: every path that changes the visible five goes through
// here, so nothing can update the page without recording it.
function setShown(list,mark){
  shownIds=list.map(r=>typeof r==='number'?r:r.id);
  if(mark!==false) markSeen(shownIds);
}

const isUnseen=r=>!seen[r.id];
function unseenIn(){return selPool().filter(isUnseen).length}

// Unseen first; then least-recently-seen, so nothing sits at the back forever.
// Shuffled before sorting so ties break randomly rather than by recipe id.
function pickPage(p,exclude){
  const ex=new Set(exclude||[]);
  const cand=p.filter(r=>!ex.has(r.id));
  const src=cand.length>=PAGE?cand:p;
  return shuffle(src).sort((a,b)=>{
    const A=seen[a.id],B=seen[b.id];
    if(!A&&!B) return 0;
    if(!A) return -1;
    if(!B) return 1;
    return (A.last-B.last)||(A.n-B.n);
  }).slice(0,PAGE);
}

// When a category is exhausted, clear its marks and say so rather than
// silently looping. Cooked recipes keep their history — that's a real signal.
function resetSeenFor(){
  selPool().forEach(r=>{delete seen[r.id]});
  save();
}
function cycleWithReset(){
  const p=selPool();
  if(unseenIn()===0&&p.length>PAGE){
    resetSeenFor();
    freshNotice={type:'reset',n:p.length};
  }
  return pickPage(p,shownIds);
}

// Below one page of unseen recipes, offer to write more of this cuisine.
function needsReplenish(){
  return canGenerate()&&unseenIn()<PAGE&&!generating;
}
function freshNoticeHtml(){
  const parts=[];
  if(freshNotice&&freshNotice.type==='reset'){
    parts.push(`<div class="fresh-note">
      <i class="ti ti-rotate"></i>You've seen all ${freshNotice.n} of these — starting the rotation again.
      <button onclick="dismissFreshNotice()" aria-label="Dismiss">×</button></div>`);
  }
  if(needsReplenish()){
    const left=unseenIn();
    const hid=selPool().length;
    parts.push(`<div class="fresh-note replenish">
      <i class="ti ti-sparkles"></i>${left?`Only ${left} unseen ${selLabel()} recipe${left===1?'':'s'} left`:`You've worked through all ${hid} ${selLabel()} recipes`} —
      <button class="fresh-cta" onclick="generateRecipes()">write some new ones</button></div>`);
  }
  return parts.join('');
}
function dismissFreshNotice(){freshNotice=null;renderCards()}

const MAX_ING=8, MAX_GEN_PER_CALL=3;

// The catalogue is BASE_RECIPES + anything generated, minus anything hidden.
// Hiding filters at pool() rather than removing from ALL_RECIPES, so favourites
// and Marco's recipe ids still resolve.
function rebuildCatalogue(){
  ALL_RECIPES=BASE_RECIPES.concat(generated);
  clearDietCache();

// The model can emit emoji this OS has no glyph for (that is how 🫙 ended up
// as blank boxes). Measure before accepting one.
let _emojiCanvas=null,_tofuW=null;
function emojiRenders(e){
  if(!e) return false;
  try{
    const c=_emojiCanvas||(_emojiCanvas=document.createElement('canvas'));
    const x=c.getContext('2d');
    x.font='32px sans-serif';
    if(_tofuW===null) _tofuW=x.measureText('￿').width;
    return Math.abs(x.measureText(e).width-_tofuW)>0.5;
  }catch(err){return true}
}
const safeEmoji=(e,fb)=>emojiRenders(e)?e:(fb||'🍽');

// Business rules the JSON schema can't express.
function validateGenerated(o,cuisine){
  const bad=m=>({ok:false,why:m});
  if(!o||typeof o!=='object') return bad('not an object');
  for(const k of ['e','t','c','desc']) if(typeof o[k]!=='string'||!o[k].trim()) return bad('missing '+k);
  for(const k of ['mins','cals']) if(!Number.isFinite(o[k])||o[k]<=0) return bad('bad '+k);
  if(o.c!==cuisine) return bad(`cuisine "${o.c}" != "${cuisine}"`);
  if(!Array.isArray(o.ing)||!o.ing.length) return bad('no ingredients');
  if(o.ing.length>MAX_ING) return bad(`${o.ing.length} ingredients (max ${MAX_ING})`);
  if(!Array.isArray(o.steps)||!o.steps.length) return bad('no steps');
  const dup=ALL_RECIPES.find(r=>r.t.toLowerCase().trim()===o.t.toLowerCase().trim());
  if(dup) return bad(`"${o.t}" already exists`);
  for(const i of o.ing){
    if(typeof i.n!=='string'||!i.n.trim()) return bad('ingredient with no name');
    if(typeof i.amt!=='string'||!i.amt.trim()) return bad(`"${i.n}" has no amount`);
    if(typeof i.core!=='boolean') return bad(`"${i.n}" has no core flag`);
    if(!i.core&&(!Array.isArray(i.swaps)||!i.swaps.length)) return bad(`"${i.n}" is swappable but has no swaps`);
    for(const s of (i.swaps||[])){
      if(!s.n||!s.amt||!s.note) return bad(`"${i.n}" has an incomplete swap`);
    }
  }
  for(const s of o.steps) if(!s.t||!s.s) return bad('step missing title or text');
  return {ok:true};
}

// Trim to the app's shape: drop empty tips, drop swaps on core ingredients,
// swap out unsupported emoji, and stamp it as generated.
function normaliseGenerated(o,id){
  return {
    id, e:safeEmoji(o.e), t:o.t.trim(), c:o.c,
    mins:Math.round(o.mins), cals:Math.round(o.cals),
    rating:Math.min(5,Math.max(3.5,Number(o.rating)||4.5)),
    desc:o.desc.trim(), gen:true,
    ing:o.ing.map(i=>{
      const out={n:i.n.trim(),amt:i.amt.trim(),emoji:safeEmoji(i.emoji,'🥄'),core:!!i.core};
      if(!i.core) out.swaps=i.swaps.map(s=>({n:s.n.trim(),amt:s.amt.trim(),note:s.note.trim()}));
      return out;
    }),
    steps:o.steps.map(s=>{
      const out={t:s.t.trim(),s:s.s.trim()};
      if(s.tip&&s.tip.trim()) out.tip=s.tip.trim();
      return out;
    }),
  };
}

function generatePrompt(cuisine,brief){
  const existing=ALL_RECIPES.filter(r=>r.c===cuisine).map(r=>r.t);
  const pantryList=pantry.size?[...pantry].join(', '):null;
  const activeDiet=sel.diets.length===1?dietCat(sel.diets[0]):null;
  let ask=brief
    ? `Write 1 new ${cuisine} recipe for Tabletalk: ${brief}`
    : `Write ${MAX_GEN_PER_CALL} new ${cuisine} recipes for Tabletalk.`;
  if(pantryList) ask+=`\nThe cook already has: ${pantryList}. Lean on these where it suits the dish.`;
  if(activeDiet) ask+=`\nEvery recipe must be ${activeDiet.label.toLowerCase()}.`;
  if(existing.length) ask+=`\n\nDo not repeat any of these existing ${cuisine} dishes:\n${existing.join(', ')}`;
  return ask;
}
const GENERATE_SYSTEM=`You write recipes for Tabletalk, a home-cooking app. House style:
- Fast: under 30 minutes wherever the dish allows.
- Short: 5 ingredients or fewer unless the dish genuinely needs more (never more than ${MAX_ING}).
- Mark an ingredient core:true only when substituting it would stop the dish being that dish. Everything else is core:false and needs 2-3 swaps.
- Swap amounts must be culinary-accurate, not copied: 100g butter becomes 75ml olive oil, not 100ml.
- Swap notes state the real effect ("hotter, deeply smoky"), never a bare label.
- 4-6 steps, each with a short title and a concrete instruction. Add a tip only where it prevents a real mistake; otherwise use an empty string.
- Use plain, widely-supported food emoji. Nothing added to Unicode after 2019.
- desc is one line under 90 characters.`;

// Generation is offered for a specific cuisine — "all cuisines", a diet
// category and the pantry have no single cuisine to write for.
function canGenerate(){
  return !mode&&!!soleCuisine();
}
function dismissGenNotice(){genNotice=null;renderCards()}
function genNoticeHtml(){
  if(!genNotice) return '';
  const n=genNotice;
  const msg=n.error
    ? n.error
    : n.own ? `Recipe ${n.edited?'updated':'saved'}. It’s in your catalogue now.`
    : `Added ${n.ok} new recipe${n.ok===1?'':'s'}${n.bad?` · ${n.bad} rejected by validation`:''}.`;
  return `<div class="gen-notice${n.error?' err':''}">
    <i class="ti ti-${n.error?'alert-triangle':'sparkles'}"></i>${msg}
    <button onclick="dismissGenNotice()" aria-label="Dismiss">×</button>
  </div>`;
}
function hiddenNoticeHtml(){
  if(!hidden.size) return '';
  return `<div class="hidden-note">${hidden.size} recipe${hidden.size===1?'':'s'} hidden ·
    <button onclick="unhideAll()">show ${hidden.size===1?'it':'them'} again</button></div>`;
}

let generating=false;
async function generateRecipes(opts){
  if(generating) return;
  opts=opts||{};
  const cuisine=opts.cuisine||soleCuisine()||(ALL_RECIPES.find(r=>r.id===shownIds[0])||{}).c;
  if(!cuisine) return;
  generating=true;renderCards();
  try{
    const res=await fetch(GENERATE_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system:[{type:'text',text:GENERATE_SYSTEM}],
        messages:[{role:'user',content:generatePrompt(cuisine,opts.brief)}],
      }),
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
    const raw=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const parsed=JSON.parse(raw);
    const accepted=[],rejected=[];
    (parsed.recipes||[]).forEach(o=>{
      const v=validateGenerated(o,cuisine);
      if(!v.ok){rejected.push(`${o&&o.t?o.t:'untitled'}: ${v.why}`);return}
      const r=normaliseGenerated(o,nextRecipeId());
      generated.push(r);rebuildCatalogue();accepted.push(r);
    });
    save();rebuildCatalogue();
    if(rejected.length) console.warn('[generate] rejected:\n  '+rejected.join('\n  '));
    if(accepted.length){
      setShown(accepted.map(r=>r.id).concat(shownIds).slice(0,5));
      genNotice={ok:accepted.length,bad:rejected.length};
      if(opts.brief) marcoHistory.push({role:'assistant',text:accepted.length===1
        ? `Written — "${accepted[0].t}", ${accepted[0].mins} minutes. It\u2019s saved to your ${accepted[0].c} recipes.`
        : `Written ${accepted.length} new ${cuisine} recipes for you.`,
        recipe_ids:accepted.map(r=>r.id)});
    } else {
      genNotice={ok:0,bad:rejected.length,error:'Nothing passed validation.'};
      if(opts.brief) marcoHistory.push({role:'assistant',text:"I tried, but what I wrote didn't pass validation. Try asking again, or narrow it down a bit.",recipe_ids:[]});
    }
  }catch(e){
    const offline=/Failed to fetch|NetworkError|load failed/i.test(e.message);
    genNotice={ok:0,bad:0,error:offline?'Start the proxy first: node marco-proxy.js':e.message};
    if(opts.brief){marcoError=genNotice.error;}
    console.error('[generate]',e);
  }finally{
    generating=false;save();renderCuisineRow();renderCards();renderMarco();
  }
}

// Tapping a pill toggles it. One tap from a clean picker goes straight to the
// recipes, which is the common case; once something is selected the picker
// stays open so adding a second filter is one tap rather than three.
function selectCuisine(id){
  const wasEmpty=!selAny();
  started=true;
  expandedId=null;openSwap={};
  if(MODES.indexOf(id)>=0){
    mode=id;pickerOpen=false;
    if(id==='search'){
      pantryOpen=false;renderPantryPanel();
      setShown(searchResults().slice(searchPage*SEARCH_MAX,(searchPage+1)*SEARCH_MAX),false);
      renderCuisineRow();renderCards();
      return;
    }
    if(id==='pantry'){
      pantryPage=0;
      if(!pantry.size) pantryOpen=true;   // nothing to rank yet — open the picker
      setShown(pantryRanked().slice(0,5));
      renderCuisineRow();renderPantryPanel();renderCards();
      return;
    }
    pantryOpen=false;renderPantryPanel();
    setShown(pickPage(selPool(),shownIds));
    renderCuisineRow();renderCards();
    return;
  }
  mode=null;pantryOpen=false;renderPantryPanel();
  if(id==='all'){
    sel.cuisines=[];                     // "all cuisines" clears the group
  } else {
    const g=selGroup(id), i=sel[g].indexOf(id);
    if(i<0) sel[g].push(id); else sel[g].splice(i,1);
  }
  pickerOpen=!wasEmpty;
  // pickPage does the rotation: unseen first, then least-recently-seen, so a
  // re-tapped filter still moves on.
  setShown(cycleWithReset());
  renderCuisineRow();renderCards();
}

function cycleFive(){
  if(mode==='search'){
    const m=searchResults();
    const pages=Math.max(1,Math.ceil(m.length/SEARCH_MAX));
    searchPage=(searchPage+1)%pages;
    setShown(m.slice(searchPage*SEARCH_MAX,(searchPage+1)*SEARCH_MAX),false);
    expandedId=null;openSwap={};renderCards();
    return;
  }
  // Pantry mode pages through the ranked list in order rather than reshuffling,
  // so the best matches stay first and every recipe is reachable.
  if(mode==='pantry'){
    const ranked=pantryRanked();
    const pages=Math.max(1,Math.ceil(ranked.length/5));
    pantryPage=(pantryPage+1)%pages;
    setShown(ranked.slice(pantryPage*5,pantryPage*5+5));
    expandedId=null;openSwap={};renderCards();
    return;
  }
  // cycleWithReset wraps around on its own and reports when a category is
  // exhausted rather than silently looping.
  setShown(cycleWithReset());
  expandedId=null;openSwap={};renderCards();
}

// ─── SWAP NOTE COLOUR CODING ──────────────────────────────────────────────────
// Maps a free-text swap note ("lighter, less rich") to one of the note-* chips.
// Order matters: "lighter, less rich" must land on lighter, not richer.
const NOTE_RULES=[
  [/hotter|spicier|fierier|more heat|extra heat/,'note-hotter'],
  [/milder|less heat|no heat|gentler|mellower/,'note-milder'],
  [/lighter|leaner|less rich|less fat|fresher/,'note-lighter'],
  [/richer|creamier|silkier|rounder|more luxurious/,'note-richer'],
  [/tangier|tangy|sharper|zestier|more acidic|brighter/,'note-tangier'],
  [/sweeter|sweet/,'note-sweeter'],
  [/smok/,'note-smoky'],
  [/same|identical|no real difference|indistinguishable/,'note-same'],
];
function noteClass(note){
  const n=(note||'').toLowerCase();
  for(const [re,cls] of NOTE_RULES) if(re.test(n)) return cls;
  return 'note-neutral';
}

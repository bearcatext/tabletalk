// ─── CHEF MARCO ───────────────────────────────────────────────────────────────
// Talks to the local proxy (marco-proxy.js), which holds the API key. The key
// must never live in this file — anyone who opens it could read it.
const MARCO_ENDPOINT='http://127.0.0.1:8787/marco';
const MARCO_MAX_TURNS=24;   // keep the tail; older turns are dropped

// Split into two stable blocks so the catalogue can sit behind a cache
// breakpoint. Caching is a prefix match: everything up to the breakpoint is
// reused across turns, and the conversation lands after it in messages[].
// The history itself is short prose, so it isn't worth its own breakpoint.
const MARCO_PERSONA=`You are Chef Marco, a warm, direct AI chef assistant in Tabletalk. Reply like a knowledgeable friend texting back — casual, max 2-3 sentences. No formality.
You are in an ongoing conversation — read what was said earlier before answering, and don't reintroduce yourself.

Work down this order, and stop at the first one that fits:
1. Recommend from the recipes listed below. Prioritise speed first, then few ingredients, then what they asked for. Return up to 4 ids.
2. If the list is headed "closest", those miss part of what they asked. Offer the good ones anyway and name what they don't cover — "no Vietnamese in here, but this Korean noodle soup is close" beats pretending it matches.
3. If the ask is too vague to choose well — no cuisine, no ingredient, no constraint, just "what's for dinner" — ask ONE short question that would narrow it. Don't ask if they already gave you enough, and never ask twice in a row.
4. Only when they wanted something specific and there is genuinely nothing near it: say so plainly and set suggest_generate true with a one-line brief and the cuisine, and a new recipe gets written for them.

Never force a poor match just to return an id, and never offer to write something new while a decent match is sitting in the list.`;

function marcoCatalogue(){
  return 'RECIPES:\n'+ALL_RECIPES.filter(r=>!hidden.has(r.id)).map(r=>
    `[${r.id}] "${r.t}" ${r.c} ${r.mins}min ing:${r.ing.map(i=>i.n).join(',')}`
  ).join('\n');
}
function marcoSystem(){
  return [
    {type:'text',text:MARCO_PERSONA},
    // Breakpoint on the last stable block — caches persona + catalogue together.
    {type:'text',text:marcoCatalogue(),cache_control:{type:'ephemeral'}},
  ];
}

// Cook mode context rides as a mid-conversation system message rather than
// being glued onto the user's text, so the transcript shows what they actually
// typed and the cached prefix stays intact. Must follow a user turn and be last.
// The catalogue Marco sees is summarised to titles and ingredient names, so
// he cannot quote amounts or steps. Generation makes this worse: it runs as a
// separate request, so a recipe he "wrote" was never in his conversation at
// all. Fix: attach the full text of whichever recipes are actually in play.
// Costs ~190 tokens each and sits after the cache breakpoint, so the 6.2k
// catalogue prefix stays cached.
const MARCO_DETAIL_MAX=3;
const MARCO_SHORTLIST=8;
function marcoDetail(r){
  return `[${r.id}] "${r.t}" — ${r.c}, ${r.mins} min, ${r.cals} cal\n`+
    `  ingredients: ${r.ing.map(i=>`${i.amt} ${i.n}`).join("; ")}\n`+
    r.ing.filter(i=>i.swaps&&i.swaps.length).map(i=>
      `  swaps for ${i.n}: ${i.swaps.map(s=>`${s.amt} ${s.n} (${s.note})`).join("; ")}`).join("\n")+
    (r.ing.some(i=>i.swaps&&i.swaps.length)?"\n":"")+
    `  steps: ${r.steps.map((s,n)=>`${n+1}. ${s.t} — ${s.s}${s.tip?" Tip: "+s.tip:""}`).join(" ")}`;
}
// In play: what you are cooking, what Marco just recommended or wrote, and
// anything you named by title in your message.
// Naming a dish should attach it, and people use short names — "carbonara",
// not "Spaghetti carbonara". Requiring the whole title meant the most obvious
// question ("how much guanciale in carbonara?") got answered from a catalogue
// line with no amounts in it.
//
// Matching on any shared word would be worse: "chicken" appears in fifteen
// titles and would attach three arbitrary ones. So a match needs at least one
// word that is distinctive to that dish — rare across the catalogue — and
// recipes are then ranked by how much of the title the query actually covers.
const TITLE_STOP=new Set(['with','and','the','from','scratch','style','made','fresh']);
const titleWords=t=>String(t||'').toLowerCase().split(/[^a-z0-9]+/)
  .filter(w=>w.length>=3&&!TITLE_STOP.has(w));

function titleMatches(q){
  const words=(q||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  if(!words.length) return [];
  const asked=new Set(words);
  const df={};
  ALL_RECIPES.forEach(r=>new Set(titleWords(r.t)).forEach(w=>{df[w]=(df[w]||0)+1}));
  const out=[];
  ALL_RECIPES.forEach(r=>{
    const tw=titleWords(r.t);
    if(!tw.length) return;
    const hit=tw.filter(w=>asked.has(w));
    if(!hit.length) return;
    const score=hit.length/tw.length;
    // Two ways in: the query covers essentially the whole title ("pad thai"),
    // or it covers half of it AND names something distinctive to that dish
    // ("carbonara"). One common word on its own is not a reference — "chicken"
    // appears in fifteen titles and should attach none of them.
    const whole=score>=TITLE_WHOLE;
    const distinct=score>=TITLE_MIN_SCORE&&hit.some(w=>df[w]<=TITLE_DISTINCT);
    if(!whole&&!distinct) return;
    out.push({r:r,score:score});
  });
  return out.sort((a,b)=>b.score-a.score||a.r.t.length-b.r.t.length).map(x=>x.r);
}
const TITLE_DISTINCT=3;
const TITLE_MIN_SCORE=0.5;
const TITLE_WHOLE=0.8;

function recipesInPlay(userText){
  const ids=[];
  if(cookRecipeId) ids.push(cookRecipeId);
  marcoHistory.slice(-4).forEach(m=>{if(m.role==="assistant"&&m.recipe_ids) ids.push(...m.recipe_ids)});
  const q=(userText||"").toLowerCase();
  if(q) titleMatches(q).forEach(r=>ids.push(r.id));
  const out=[],taken=new Set();
  ids.forEach(id=>{
    if(taken.has(id)||out.length>=MARCO_DETAIL_MAX) return;
    const r=ALL_RECIPES.find(x=>x.id===id);
    if(r){taken.add(id);out.push(r)}
  });
  return out;
}
// One system message carrying both, appended after the cached prefix. Must
// follow a user turn and be last in the array.
// What the search bar does is deliberately strict: every word has to land, or
// you get a wrong answer presented as a right one. A conversation is different.
// "A light fish supper" matches nothing exactly, yet the catalogue is full of
// fish suppers, and answering "nothing fits, shall I write one?" would be a
// poor reply when the shelf is stocked.
//
// So: exact matches if there are any, otherwise whatever matches the most of
// what was asked, best first. Marco is told which of the two he is looking at
// so he can hedge honestly rather than overclaim.
function marcoCandidates(q){
  const exact=searchMatches(q);
  if(exact.length) return {exact:true,list:exact.slice(0,MARCO_SHORTLIST)};
  const f=searchFilters(q);
  if(!f.terms.length&&!f.cats.length&&!f.quick&&!f.easy&&!f.ahead) return {exact:false,list:[]};
  const scored=[];
  ALL_RECIPES.forEach(r=>{
    if(hidden.has(r.id)) return;
    if(f.quick&&r.mins>QUICK_MINS) return;
    if(f.easy&&!isEasy(r)) return;
    if(f.ahead&&!hasAhead(r)) return;
    if(f.cats.some(c=>!dietStatus(r,c).ok)) return;
    const hay=(r.t+' '+r.c+' '+(r.desc||'')+' '+r.ing.map(i=>i.n).join(' ')).toLowerCase();
    const hit=f.terms.filter(t=>hay.indexOf(t)>=0).length;
    if(hit) scored.push({r:r,hit:hit});
  });
  return {exact:false,
    list:scored.sort((a,b)=>b.hit-a.hit||a.r.mins-b.r.mins).slice(0,MARCO_SHORTLIST).map(x=>x.r)};
}

// ─── MARCO WITHOUT A PROXY ───────────────────────────────────────────────────
// The matching was always local. marcoContextMessage works out which recipes
// answer the question and attaches their amounts, swaps and steps — then sends
// the lot away purely so the reply can be phrased. Without a proxy the phrasing
// is gone, but the answer is not.
//
// So rather than telling someone who has no proxy to run one, read the answer
// out plainly. This handles the questions that are lookups against data we
// already hold. Anything needing judgement — "something impressive but not
// fiddly" — genuinely does need the model, and says so.

// Strip the question scaffolding and the dish name, leaving the thing being
// asked about.
const ASK_WORDS=new Set(['how','much','many','long','what','whats','which','is','are',
  'do','does','did','i','we','you','need','needs','use','using','used','for','in','on',
  'the','a','an','of','to','instead','substitute','sub','replace','swap','swapped',
  'can','could','with','without','take','takes','make','makes','made','cook','cooking',
  'there','any','put','goes','go','it','me','my','this','that','and','or','be','get']);
function questionSubject(q,r){
  const clean=t=>t.split(' ').filter(Boolean).filter(w=>!ASK_WORDS.has(w));
  const base=String(q||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  let s=' '+base+' ';
  if(r) titleWords(r.t).forEach(w=>{s=s.split(' '+w+' ').join(' ')});
  const stripped=clean(s).join(' ').trim();
  if(stripped) return stripped;
  // the ingredient can be part of the dish name — "chicken" in "Chicken korma" —
  // so removing the title can remove the very thing being asked about
  if(r){
    const back=clean(base).find(w=>ingredientIn(r,w));
    if(back) return back;
  }
  return '';
}

// Look in the dish being discussed first, then anywhere in the catalogue.
function findIngredient(r,term){
  const t=normIng(term);
  if(!t) return null;
  const wt=t.split(' ');
  const match=ing=>{
    const n=normIng(ing.n);
    if(!n) return false;
    const wn=n.split(' ');
    return wt.every(w=>wn.includes(w))||wn.every(w=>wt.includes(w));
  };
  if(r){const ing=r.ing.find(match);if(ing) return {recipe:r,ing:ing}}
  const vis=ALL_RECIPES.filter(x=>!hidden.has(x.id));
  // a recipe that lists alternatives answers the question; one that calls it
  // core only tells you no
  for(const x of vis){
    const ing=x.ing.find(i=>match(i)&&(i.swaps||[]).length);
    if(ing) return {recipe:x,ing:ing};
  }
  for(const x of vis){
    const ing=x.ing.find(match);
    if(ing) return {recipe:x,ing:ing};
  }
  return null;
}

function ingredientIn(r,term){
  const t=normIng(term);
  if(!r||!t) return null;
  const wt=t.split(' ');
  return r.ing.find(ing=>{
    const n=normIng(ing.n);
    if(!n) return false;
    const wn=n.split(' ');
    return wt.every(w=>wn.includes(w))||wn.every(w=>wt.includes(w));
  })||null;
}

function marcoLocalAnswer(q){
  const ql=' '+String(q||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ')+' ';
  const has=(...w)=>w.some(x=>ql.indexOf(' '+x+' ')>=0);
  const r=recipesInPlay(q)[0]||null;
  const subject=questionSubject(q,r);

  // what could I use instead of this
  if(has('instead','substitute','sub','replace','swap','swaps','alternative','alternatives')){
    if(r&&subject&&!ingredientIn(r,subject))
      return {text:`${r.t} does not list ${subject}, so there is nothing to swap.`,recipe_ids:[r.id]};
    const hit=findIngredient(r,subject);
    if(hit&&(hit.ing.swaps||[]).length){
      const list=hit.ing.swaps.map(s=>`${s.amt} ${s.n} (${s.note})`).join('; ');
      return {text:`Instead of ${hit.ing.n.toLowerCase()} in ${hit.recipe.t} — ${list}.`,
              recipe_ids:[hit.recipe.id]};
    }
    if(hit) return {text:`${hit.recipe.t} treats ${hit.ing.n.toLowerCase()} as core, so there is no swap written for it.`,
                    recipe_ids:[hit.recipe.id]};
  }

  // how much of it
  if(has('how')&&(has('much')||has('many'))){
    if(r&&subject&&!ingredientIn(r,subject))
      return {text:`${r.t} does not list ${subject}.`,recipe_ids:[r.id]};
    const hit=findIngredient(r,subject);
    if(hit){
      const rec=hit.recipe, f=servesFactor(rec);
      const amt=scaleAmount(hit.ing.amt,f);
      const at=servesOf(rec)!==baseServes(rec)?`, at ${servesOf(rec)} servings`:'';
      return {text:`${withUS(amt)} of ${hit.ing.n.toLowerCase()} in ${rec.t}${at}.`,
              recipe_ids:[rec.id]};
    }
  }

  // how long does it take
  if(r&&has('how')&&(has('long')||has('time'))){
    const split=hasAhead(r)?` — ${aheadMins(r)} of that can be done ahead, leaving ${nightMins(r)} on the night`:'';
    return {text:`${r.t} takes ${r.mins} minutes${split}.`,recipe_ids:[r.id]};
  }

  // what are the steps
  if(r&&(has('step','steps')||(has('how')&&has('make','cook','do')))){
    return {text:`${r.t}, ${r.steps.length} steps — ${r.steps.map((s,i)=>`${i+1}. ${s.t}`).join(', ')}. Tap it for the detail.`,
            recipe_ids:[r.id]};
  }

  // what is in it
  if(r&&(has('ingredients')||((has('what')||has('whats'))&&(has('in')||has('need'))))){
    return {text:`${r.t} needs ${r.ing.map(i=>i.n.toLowerCase()).join(', ')}.`,recipe_ids:[r.id]};
  }

  // what can I make — the matcher answers this on its own
  const cand=marcoCandidates(q);
  if(cand.list.length){
    const n=cand.list.length;
    return {text:cand.exact
        ? (n===1?`One of your recipes matches that.`:`${n} of your recipes match that.`)
        : `Nothing matches every part of that, but these come closest.`,
      recipe_ids:cand.list.slice(0,4).map(x=>x.id)};
  }
  return null;
}

function marcoContextMessage(userText){
  const parts=[];
  if(cookRecipeId){
    const r=ALL_RECIPES.find(x=>x.id===cookRecipeId);
    if(r){
      const step=r.steps[cookStepIdx];
      parts.push(`The user is cooking "${r.t}" right now and is on `+(step
        ? `step ${cookStepIdx+1} of ${r.steps.length}: "${step.t}" — ${step.s}`
        : `the final step`)+` Answer about this dish and this step unless they clearly ask about something else.`);
    }
  }
  const detail=recipesInPlay(userText);
  if(detail.length){
    parts.push(`Full detail for the ${detail.length===1?"recipe":"recipes"} being discussed — `+
      `use these exact amounts and steps when asked, and do not invent others:\n`+
      detail.map(marcoDetail).join("\n"));
  }
  // "What can I make with chicken and rice" should be answered from the shelf,
  // not from memory. The same matcher the search bar uses finds the candidates
  // and Marco picks among them, so he cannot invent an id or miss an obvious
  // match while scanning 220 lines. Only when nothing is already in play — a
  // follow-up is about the dish in hand, not a fresh hunt.
  if(!detail.length){
    const cand=marcoCandidates(userText);
    const hits=cand.list;
    if(hits.length) parts.push((cand.exact
      ? `Recipes in the catalogue matching what they asked for. Prefer these before offering to write anything new:`
      : `Nothing matches every part of that, but these come closest. Offer the good ones and say plainly what they do not cover, rather than pretending they fit:`)+"\n"+
      hits.map(r=>`[${r.id}] "${r.t}" ${r.c} ${r.mins}min`).join("\n"));
  }
  return parts.length?{role:"system",content:parts.join("\n\n")}:null;
}

function marcoTrimmed(){
  return marcoHistory.slice(-MARCO_MAX_TURNS);
}

// ── transcript ──
function marcoBubble(role,inner,cls){
  if(role==='user') return `<div class="marco-msg user">${inner}</div>`;
  return `<div class="marco-msg ${cls||''}">
    <div class="marco-rhead"><span style="font-size:17px">👨‍🍳</span><span class="marco-rname">Chef Marco</span></div>
    ${inner}</div>`;
}
function marcoCardsHtml(ids){
  if(!ids||!ids.length) return "";
  const cards=ids.map(id=>ALL_RECIPES.find(x=>x.id===id))
    .filter(r=>r&&!hidden.has(r.id));
  if(!cards.length) return "";
  return `<div class="marco-cards">`+
    cards.map(r=>recipeCardHtml(r,{onclick:`jumpToRecipe(${r.id})`})).join("")+`</div>`;
}
// When nothing in the catalogue fits, Marco offers to write the dish instead
// of leaving the user at a dead end.
function marcoOfferHtml(m){
  if(!m.offer) return '';
  if(m.offer.done) return `<div class="marco-offer done"><i class="ti ti-check"></i>Added to your recipes</div>`;
  const label=generating?'Writing…':`Write me ${m.offer.brief.length>46?'this recipe':'“'+esc(m.offer.brief)+'”'}`;
  return `<button class="marco-offer" ${generating?'disabled':''} onclick="marcoGenerate(${marcoHistory.indexOf(m)})">
    <i class="ti ti-sparkles"></i>${label}</button>`;
}
async function marcoGenerate(idx){
  const m=marcoHistory[idx];
  if(!m||!m.offer||generating) return;
  const cuisine=(m.offer.cuisine||'').trim()||'All cuisines';
  m.offer.done=true;save();renderMarco();
  await generateRecipes({cuisine,brief:m.offer.brief});
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}

function renderMarco(){
  const areas=[document.getElementById('marco-reply-area-bar'),document.getElementById('cook-marco-area')];
  let h='';
  if(marcoHistory.length){
    h+=`<div class="marco-thread-head">
      <span>${marcoHistory.filter(m=>m.role==='user').length} message${marcoHistory.filter(m=>m.role==='user').length===1?'':'s'}</span>
      <button onclick="clearMarco()">Clear</button></div>`;
  }
  marcoHistory.forEach(m=>{
    if(m.role==='user') h+=marcoBubble('user',esc(m.content));
    else h+=marcoBubble('assistant',`<div>${esc(m.text)}</div>${m.local?'<div class="marco-local">from your recipes</div>':''}${marcoCardsHtml(m.recipe_ids)}${marcoOfferHtml(m)}`);
  });
  if(marcoPending) h+=marcoBubble('assistant','<div class="typing"><span></span><span></span><span></span></div>');
  if(marcoError) h+=marcoBubble('assistant',`<div>${marcoError}</div>`,'err');
  areas.forEach(a=>{
    if(!a) return;
    a.innerHTML=h;
    a.scrollTop=a.scrollHeight;
  });
}
function clearMarco(){
  marcoHistory=[];marcoError=null;save();renderMarco();
}

let marcoPending=false,marcoError=null;
async function askMarco(fromCook){
  const inp=document.getElementById(fromCook?'cook-marco-in':'marco-in');
  if(!inp) return;
  const q=inp.value.trim();
  if(!q||marcoPending) return;
  inp.value='';
  marcoError=null;marcoPending=true;
  marcoHistory.push({role:'user',content:q});
  save();renderMarco();
  try{
    // The API is stateless — the whole conversation goes up every turn.
    const msgs=marcoTrimmed().map(m=>({role:m.role,content:m.role==='user'?m.content:m.text}));
    const ctx=marcoContextMessage(q);
    if(ctx) msgs.push(ctx);
    const res=await fetch(MARCO_ENDPOINT,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:marcoSystem(),messages:msgs}),
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||('HTTP '+res.status));
    const u=data.usage||{};
    console.log(`[marco] in=${u.input_tokens||0} cache_read=${u.cache_read_input_tokens||0} out=${u.output_tokens||0}`);
    const rawText=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const parsed=JSON.parse(rawText);
    marcoHistory.push({role:'assistant',text:parsed.text,recipe_ids:Array.isArray(parsed.recipe_ids)?parsed.recipe_ids:[],offer:parsed.suggest_generate&&parsed.generate_brief?{brief:parsed.generate_brief,cuisine:parsed.generate_cuisine||''}:null});
    save();
  }catch(e){
    const offline=/Failed to fetch|NetworkError|load failed/i.test(e.message);
    if(offline){
      // the retrieval never needed the proxy, only the phrasing did
      const local=marcoLocalAnswer(q);
      if(local){
        marcoHistory.push({role:"assistant",text:local.text,recipe_ids:local.recipe_ids||[],local:true});
        save();
      } else {
        marcoError="I can look things up in your recipes — name an ingredient, a dish, or "
          +"say what you fancy. Anything more open-ended needs the proxy running.";
      }
    } else {
      marcoError=`Something went wrong — ${esc(e.message)}`;
    }
    console.error('[marco]',e);
  }finally{
    marcoPending=false;renderMarco();
  }
}
function marcoKey(e,fromCook){if(e.key==='Enter'){e.preventDefault();askMarco(fromCook)}}
function toggleCookMarco(){
  const p=document.getElementById('cook-marco');
  if(!p) return;
  const open=p.style.display!=='flex';
  p.style.display=open?'flex':'none';
  if(open){renderMarco();document.getElementById('cook-marco-in').focus()}
}


// ─── MIGRATE old string swaps → new {n,amt} format ───────────────────────────
(function migrateSwaps(){
  let changed=false;
  Object.keys(swaps).forEach(k=>{
    if(typeof swaps[k]==='string'){delete swaps[k];changed=true;}
  });
  if(changed)save();
})();


// ─── SWITCHING PERSON ────────────────────────────────────────────────
const WHO_EMOJI=['🍳','🥕','🍅','🌶','🍋','🍄','🐟','🧀'];
function loadState(){
  favorites=JSON.parse(LS.getItem('dw_favs')||'[]');
  comments=JSON.parse(LS.getItem('dw_comments')||'{}');
  swaps=JSON.parse(LS.getItem('dw_swaps')||'{}');
  stepsDone=JSON.parse(LS.getItem('dw_steps')||'{}');
  pantry=new Set(JSON.parse(LS.getItem('dw_pantry')||'[]'));
  generated=JSON.parse(LS.getItem('dw_generated')||'[]');
  hidden=new Set(JSON.parse(LS.getItem('dw_hidden')||'[]'));
  seen=JSON.parse(LS.getItem('dw_seen')||'{}');
  cooked=JSON.parse(LS.getItem('dw_cooked')||'{}');
  allergyMode=JSON.parse(LS.getItem('dw_allergy')||'false');
  plan=new Set(JSON.parse(LS.getItem('dw_plan')||'[]'));
  marcoHistory=JSON.parse(LS.getItem('dw_marco')||'[]');
  serveCount=JSON.parse(LS.getItem('dw_serves')||'{}');
  ALL_RECIPES=BASE_RECIPES.concat(generated);
  clearDietCache();
}
// Switching person changes every list on screen, so start them back at the
// picker rather than leaving someone else's results sitting there.
function applyProfile(id){
  activeProfile=id;saveProfiles();
  loadState();
  sel={cuisines:[],diets:[],efforts:[]};mode=null;started=false;
  shownIds=[];expandedId=null;pickerOpen=true;searchQuery='';preSearchSel=null;
  cookRecipeId=null;
  showPg('discover');
  renderSearchBar();renderCuisineRow();renderPantryPanel();renderCards();
  updateFavBadge();updatePlanBadge();renderMarco();renderWhoBtn();
}
function switchProfile(id,pin){
  const p=profileById(id);
  if(!p) return {ok:false,err:'No such person.'};
  if(p.id===activeProfile) return {ok:true};
  if(p.pin&&!pinOk(p,pin)) return {ok:false,err:'That PIN does not match.'};
  applyProfile(id);
  return {ok:true};
}
function newProfileId(){
  let id;
  do{ id=Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
  while(profileById(id));
  return id;
}
function addProfile(name,fl,pin){
  name=String(name||'').trim().slice(0,20);
  if(!name) return {ok:false,err:'Give them a name.'};
  if(profiles.some(p=>p.name.toLowerCase()===name.toLowerCase()))
    return {ok:false,err:'Someone already has that name.'};
  const id=newProfileId();
  profiles.push({id:id,name:name,fl:fl||WHO_EMOJI[profiles.length%WHO_EMOJI.length],pin:null});
  saveProfiles();
  if(pin) setPin(id,pin);
  return {ok:true,id:id};
}
function renameProfile(id,name){
  name=String(name||'').trim().slice(0,20);
  const p=profileById(id);
  if(!p||!name) return {ok:false,err:'Give them a name.'};
  if(profiles.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))
    return {ok:false,err:'Someone already has that name.'};
  p.name=name;saveProfiles();return {ok:true};
}
// Removing a person takes their pantry and stars with them. No undo, so the
// button asks first.
function removeProfile(id){
  if(profiles.length<2) return {ok:false,err:'There has to be someone.'};
  const p=profileById(id); if(!p) return {ok:false,err:'No such person.'};
  profiles=profiles.filter(x=>x.id!==id);
  DW_KEYS.forEach(k=>{try{RAW_LS.removeItem('p'+id+'_'+k)}catch(e){}});
  if(activeProfile===id){applyProfile(profiles[0].id)} else {saveProfiles()}
  return {ok:true};
}

let whoView={mode:'list',target:null,err:'',fl:null};
function openWho(){whoView={mode:'list',target:null,err:'',fl:null};renderWho();
  const o=document.getElementById('who-overlay'); if(o) o.hidden=false}
function closeWho(){const o=document.getElementById('who-overlay'); if(o) o.hidden=true}
function whoGo(m,t){whoView={mode:m,target:t||null,err:'',fl:null};renderWho()}
function whoErr(e){whoView.err=e;renderWho()}
function whoVal(id){const e=document.getElementById(id);return e?e.value:''}
function renderWhoBtn(){
  const b=document.getElementById('who-btn'); if(!b) return;
  const p=currentProfile();
  b.innerHTML=p?'<span class="who-fl">'+p.fl+'</span>':'';
  b.setAttribute('aria-label','Cooking as '+(p?p.name:'someone')+' — switch person');
}
function whoDoSwitch(id){
  const r=switchProfile(id,whoVal('who-pin'));
  if(r.ok){closeWho()} else {whoErr(r.err)}
}
function whoDoAdd(){
  const r=addProfile(whoVal('who-name'),whoView.fl,whoVal('who-newpin'));
  if(!r.ok) return whoErr(r.err);
  applyProfile(r.id);closeWho();
}
function whoPickEmoji(f){whoView.fl=f;renderWho()}
function whoDoRename(){
  const r=renameProfile(whoView.target,whoVal('who-rename'));
  if(!r.ok) return whoErr(r.err);
  renderWhoBtn();whoGo('list');
}
function whoDoPin(){setPin(whoView.target,whoVal('who-setpin'));whoGo('list')}
function whoDoRemove(){
  const r=removeProfile(whoView.target);
  if(!r.ok) return whoErr(r.err);
  renderWhoBtn();whoGo('list');
}
function renderWho(){
  const el=document.getElementById('who-overlay'); if(!el) return;
  const err=whoView.err?'<div class="who-err">'+esc(whoView.err)+'</div>':'';
  const v=whoView.mode;
  let body;
  if(v==='pin'){
    const p=profileById(whoView.target)||{name:'',fl:'',id:''};
    body='<div class="who-head">'+p.fl+' '+esc(p.name)+'</div>'
      +'<p class="who-sub">Enter their PIN to switch.</p>'
      +'<input class="who-in" id="who-pin" type="tel" inputmode="numeric" autocomplete="off" placeholder="PIN">'
      +err
      +'<button class="who-go" onclick="whoDoSwitch(\''+p.id+'\')">Unlock</button>'
      +'<button class="who-back" onclick="whoGo(\'list\')">Back</button>';
  } else if(v==='add'){
    const fl=whoView.fl||WHO_EMOJI[profiles.length%WHO_EMOJI.length];
    body='<div class="who-head">Add someone</div>'
      +'<input class="who-in" id="who-name" maxlength="20" placeholder="Their name">'
      +'<div class="who-emoji">'+WHO_EMOJI.map(function(e){
          return '<button class="who-e'+(e===fl?' on':'')+'" onclick="whoPickEmoji(\''+e+'\')">'+e+'</button>'}).join('')+'</div>'
      +'<input class="who-in" id="who-newpin" type="tel" inputmode="numeric" autocomplete="off" placeholder="PIN (optional)">'
      +err
      +'<button class="who-go" onclick="whoDoAdd()">Create</button>'
      +'<button class="who-back" onclick="whoGo(\'list\')">Back</button>';
  } else if(v==='manage'){
    const p=profileById(whoView.target)||{name:'',fl:'',id:'',pin:null};
    body='<div class="who-head">'+p.fl+' '+esc(p.name)+'</div>'
      +'<input class="who-in" id="who-rename" maxlength="20" value="'+escAttr(p.name)+'">'
      +'<button class="who-go" onclick="whoDoRename()">Save name</button>'
      +'<input class="who-in" id="who-setpin" type="tel" inputmode="numeric" autocomplete="off" placeholder="'
      +(p.pin?'New PIN — leave blank to remove':'Set a PIN (optional)')+'">'
      +'<button class="who-go" onclick="whoDoPin()">'+(p.pin?'Change PIN':'Set PIN')+'</button>'
      +err
      +(profiles.length>1
        ? '<button class="who-danger" onclick="whoConfirmRemove()">Remove '+esc(p.name)+'</button>'
        : '')
      +'<button class="who-back" onclick="whoGo(\'list\')">Back</button>';
  } else {
    body='<div class="who-head">Who is cooking?</div><div class="who-list">'
      +profiles.map(function(p){
        const on=p.id===activeProfile;
        const act=on?'closeWho()':(p.pin?'whoGo(\'pin\',\''+p.id+'\')':'whoDoSwitch(\''+p.id+'\')');
        return '<div class="who-row'+(on?' on':'')+'">'
          +'<button class="who-pick" onclick="'+act+'">'
          +'<span class="who-fl">'+p.fl+'</span><span class="who-nm">'+esc(p.name)+'</span>'
          +(p.pin?'<i class="ti ti-lock"></i>':'')
          +(on?'<span class="who-now">cooking</span>':'')
          +'</button>'
          +'<button class="who-cog" onclick="whoGo(\'manage\',\''+p.id+'\')" aria-label="Settings for '+escAttr(p.name)+'"><i class="ti ti-dots"></i></button>'
          +'</div>'}).join('')
      +'</div>'+err
      +'<button class="who-go" onclick="whoGo(\'add\')"><i class="ti ti-plus"></i> Add someone</button>'
      +'<p class="who-note">Each person gets their own pantry, stars and plan. A PIN stops someone'
      +' opening the wrong one by accident — it is not a lock, and anyone who knows their way'
      +' around a browser can read what is stored here.</p>'
      +'<button class="who-back" onclick="closeWho()">Done</button>';
  }
  el.innerHTML='<div class="who-sheet" role="dialog" aria-modal="true">'+body+'</div>';
}
function whoConfirmRemove(){
  const p=profileById(whoView.target); if(!p) return;
  if(confirm('Remove '+p.name+'? Their pantry, stars and plan go with them.')) whoDoRemove();
}

renderCuisineRow();
renderPantryPanel();
updateFavBadge();
renderWhoBtn();
renderMarco();
updatePlanBadge();
renderSearchBar();
